name: Persist secondary transform v2

on:
  push:
    paths:
      - .github/workflows/persist-secondary-transform-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch files
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check secondary.js
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test persistence
        run: |
          rm -rf dist
          mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/
          python3 -m http.server 4173 --directory dist >/tmp/rna-http.log 2>&1 &
          echo $! > /tmp/server.pid
          echo '' | base64 -d > /tmp/test.mjs
          node /tmp/test.mjs
          kill $(cat /tmp/server.pid) || true
      - name: Commit verified fix
        run: |
          rm .github/workflows/persist-secondary-transform.yml
          rm .github/workflows/persist-secondary-transform-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add secondary.js index.html .github/workflows/persist-secondary-transform.yml .github/workflows/persist-secondary-transform-v2.yml
          git commit -m 'Persist secondary selection transforms after deselection'
          git push
