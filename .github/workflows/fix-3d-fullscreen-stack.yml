name: Fix molecular 3D fullscreen fallback stacking

on:
  push:
    branches: [molecular-3d-interaction-learning-20261011]
    paths:
      - .github/workflows/fix-3d-fullscreen-stack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: molecular-3d-interaction-learning-20261011
          fetch-depth: 0
      - name: Patch fallback fullscreen stacking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('chemistry-editor.js')
          s=p.read_text()
          old='''    const expanded=!threeDPanel.classList.contains("chem-3d-expanded");\n    threeDPanel.classList.toggle("chem-3d-expanded",expanded);document.body.classList.toggle("chem-3d-expanded-open",expanded);\n    const button=dialog?.querySelector("#chem3DFullscreen");if(button)button.textContent=expanded?"Exit full screen":"Full screen";'''
          new='''    const expanded=!threeDPanel.classList.contains("chem-3d-expanded");\n    threeDPanel.classList.toggle("chem-3d-expanded",expanded);\n    dialog?.classList.toggle("chem-3d-dialog-expanded",expanded);\n    document.body.classList.toggle("chem-3d-expanded-open",expanded);\n    const button=dialog?.querySelector("#chem3DFullscreen");if(button)button.textContent=expanded?"Exit full screen":"Full screen";'''
          if old not in s: raise SystemExit('fullscreen fallback anchor not found')
          s=s.replace(old,new,1)
          old='''    dialog.addEventListener("close",()=>{document.body.classList.remove("chem-editor-open","chem-3d-expanded-open");threeDDrag=null;threeDPointers.clear();threeDPinch=null;threeDPanel?.classList.remove("chem-3d-expanded");});'''
          new='''    dialog.addEventListener("close",()=>{document.body.classList.remove("chem-editor-open","chem-3d-expanded-open");dialog.classList.remove("chem-3d-dialog-expanded");threeDDrag=null;threeDPointers.clear();threeDPinch=null;threeDPanel?.classList.remove("chem-3d-expanded");});'''
          if old not in s: raise SystemExit('dialog close anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('chemistry-editor.css')
          s=p.read_text()
          marker='''body.chem-3d-expanded-open{overflow:hidden!important}\n'''
          insert='''body.chem-3d-expanded-open{overflow:hidden!important}\n#chemEditorDialog.chem-3d-dialog-expanded[open]{\n  z-index:5000!important;top:0!important;left:0!important;right:0!important;bottom:0!important;\n  inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;\n  overflow:visible!important;border:0!important;border-radius:0!important;background:transparent!important;\n}\n#chemEditorDialog.chem-3d-dialog-expanded .chem-3d-panel.chem-3d-expanded{z-index:5100!important;pointer-events:auto!important}\n'''
          if marker not in s: raise SystemExit('fullscreen CSS marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check chemistry-editor.js
      - name: Commit fallback fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemistry-editor.js chemistry-editor.css
          git commit -m "Fix molecular 3D fullscreen fallback stacking"
          git push origin HEAD:molecular-3d-interaction-learning-20261011
