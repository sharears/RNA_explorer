name: Molecular drawing regression

on:
  pull_request:
    paths:
      - chemistry-editor.css
      - chemistry-editor.js
      - export-tools.js
      - index.html
      - tests/molecular-drawing-workspace-regression.mjs
      - .github/workflows/molecular-drawing-regression.yml
  push:
    branches: [main]
    paths:
      - chemistry-editor.css
      - chemistry-editor.js
      - export-tools.js
      - index.html
      - tests/molecular-drawing-workspace-regression.mjs
      - .github/workflows/molecular-drawing-regression.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve RNA Explorer
        run: |
          python3 -m http.server 4173 >/tmp/rna-http.log 2>&1 &
          echo $! > /tmp/rna-http.pid
          sleep 2
      - name: Test Molecular Drawing workspace and five requested features
        run: node tests/molecular-drawing-workspace-regression.mjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-drawing-regression-diagnostics
          path: |
            /tmp/molecular-drawing-workspace.png
            /tmp/rna-http.log
          if-no-files-found: ignore
