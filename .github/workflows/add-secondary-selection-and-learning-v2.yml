        run: |
          rm -f .github/workflows/add-secondary-selection-and-learning-v2.yml
          rm -rf node_modules dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary.js secondary-selection-tools.js secondary.css learning-tools.js learning-tools.css index.html tests/secondary-selection-learning-v2-browser.mjs .github/workflows/static-checks.yml .github/workflows/add-secondary-selection-and-learning-v2.yml
          git commit -m 'Add secondary selection transforms and leveled RNA learning'
          git push
