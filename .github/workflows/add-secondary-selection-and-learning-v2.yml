name: Add secondary selection and learning v2

on:
  push:
    paths:
      - .github/workflows/add-secondary-selection-and-learning-v2.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply staged update
        run: python3 tools/apply-secondary-learning-v2.py

      - name: Check JavaScript syntax
        run: |
          node --check secondary.js
          node --check secondary-selection-tools.js
          node --check learning-tools.js
          node --check tests/secondary-selection-learning-v2-browser.mjs

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build test copy
        run: |
          rm -rf dist
          mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/

      - name: Test the new features in Chromium
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/rna-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/secondary-selection-learning-v2-browser.mjs
          node tests/homepage-browser.mjs
          node tests/secondary-browser.mjs

      - name: Commit verified update
        run: |
          rm -f .github/workflows/add-secondary-selection-and-learning-v2.yml
          rm -f tools/apply-secondary-learning-v2.py learning-tools-v2.js
          rm -rf node_modules dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add secondary selection transforms and leveled RNA learning'
          git push
