name: Geometry-aware 3D browser

# Dedicated chemistry/geometry regression for the browser-only 3D engine.
on:
  push:
    branches: [geometry-aware-3d-20261010]
    paths:
      - chemistry-3d-openbabel.js
      - chemistry-editor.js
      - chemistry-editor.css
      - index.html
      - tests/geometry-aware-3d-browser.mjs
      - .github/workflows/geometry-aware-3d-browser.yml
  pull_request:
    paths:
      - chemistry-3d-openbabel.js
      - chemistry-editor.js
      - chemistry-editor.css
      - index.html
      - tests/geometry-aware-3d-browser.mjs
      - .github/workflows/geometry-aware-3d-browser.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve RNA Explorer
        run: |
          python3 -m http.server 4173 >/tmp/rna-http.log 2>&1 &
          echo $! > /tmp/rna-http.pid
          sleep 2
      - name: Verify MMFF94/UFF geometry and PyMOL-style 3D UI
        run: node tests/geometry-aware-3d-browser.mjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-aware-3d-diagnostics
          path: |
            /tmp/geometry-aware-3d.png
            /tmp/rna-http.log
          if-no-files-found: ignore
