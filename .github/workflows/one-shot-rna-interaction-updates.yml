name: One-shot RNA interaction updates

on:
  push:
    paths:
      - .github/workflows/one-shot-rna-interaction-updates.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Align patch script with current Secondary source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/apply_rna_interaction_updates.py')
          s=p.read_text()
          s=s.replace("'circleColor:\"#c5d6e2\",circleWidth:1,letterColor:\"#fff\",letterSize:16,'", "'circleColor:\"#c5d6e2\",\\n    circleWidth:1, letterColor:\"#ffffff\", letterSize:16, font:\"monospace\",'")
          s=s.replace("'circleColor:\"#c5d6e2\",circleWidth:1,circleVisible:true,letterColor:\"#fff\",letterSize:16,'", "'circleColor:\"#c5d6e2\",\\n    circleWidth:1, circleVisible:true, letterColor:\"#ffffff\", letterSize:16, font:\"monospace\",'")
          p.write_text(s)
          PY
      - name: Apply six requested updates
        run: python3 .github/apply_rna_interaction_updates.py
      - name: Syntax checks
        run: |
          node --check chemistry-editor.js
          node --check secondary.js
          node --check guided-transitions.js
          node --check tertiary.js
      - name: Prepare focused test harness
        run: |
          npm install --no-save linkedom
          mkdir -p dist
          cp index.html *.js *.css dist/
          cp -r data dist/data
          cp -r assets dist/assets
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/chemistry.cjs')
          s=p.read_text()
          old='window.matchMedia=()=>({matches:false});'
          new="window.location={href:'http://localhost/'};\nwindow.matchMedia=()=>({matches:false});"
          if old not in s:
              raise SystemExit('chemistry location harness signature changed')
          s=s.replace(old,new,1)
          old='const ctx=vm.createContext({document,window,console,CustomEvent:window.CustomEvent,Option:OptionCtor,'
          new='const ctx=vm.createContext({document,window,URL,console,CustomEvent:window.CustomEvent,Option:OptionCtor,'
          if old not in s:
              raise SystemExit('chemistry VM harness signature changed')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Focused regression checks
        run: |
          node tests/chemistry-editor.cjs
          node tests/secondary-v7.cjs
          node tests/tertiary.cjs
          node tests/chemistry.cjs
          node tests/security.cjs
      - name: Commit finished update
        run: |
          rm -f .github/workflows/one-shot-rna-interaction-updates.yml .github/apply_rna_interaction_updates.py
          git checkout -- tests/chemistry.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemistry-editor.js secondary.js guided-transitions.js index.html .github/workflows/one-shot-rna-interaction-updates.yml .github/apply_rna_interaction_updates.py
          git commit -m "Add molecular transforms, ring fusion, and learning controls"
          git push origin HEAD:main
