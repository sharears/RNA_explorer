name: One-shot RNA interaction updates

on:
  push:
    paths:
      - .github/workflows/one-shot-rna-interaction-updates.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply six requested updates
        run: python3 .github/apply_rna_interaction_updates.py
      - name: Syntax checks
        run: |
          node --check chemistry-editor.js
          node --check secondary.js
          node --check guided-transitions.js
          node --check tertiary.js
      - name: Focused regression checks
        run: |
          npm install --no-save linkedom
          node tests/chemistry-editor.cjs
          node tests/secondary-v7.cjs
          node tests/chemistry.cjs
          node tests/security.cjs
      - name: Commit finished update
        run: |
          rm -f .github/workflows/one-shot-rna-interaction-updates.yml .github/apply_rna_interaction_updates.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemistry-editor.js secondary.js guided-transitions.js index.html .github/workflows/one-shot-rna-interaction-updates.yml .github/apply_rna_interaction_updates.py
          git commit -m "Add molecular transforms, ring fusion, and learning controls"
          git push origin HEAD:main
