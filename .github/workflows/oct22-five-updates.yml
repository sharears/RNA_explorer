name: RNA Explorer five updates regression
on:
  push:
    branches:
      - feat/secondary-interaction-and-rna-facts-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: which google-chrome || which chromium || true
      - name: Start app server
        run: |
          python3 -m http.server 4173 >/tmp/rna-five-http.log 2>&1 &
          echo $! >/tmp/rna-five-http.pid
          sleep 2
      - run: node tests/oct22-five-updates-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rna-five-updates-browser-report
          path: test-output/oct22-five-updates/
