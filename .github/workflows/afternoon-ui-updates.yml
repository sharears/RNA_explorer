name: Apply afternoon RNA Explorer updates

on:
  push:
    paths:
      - .github/workflows/afternoon-ui-updates.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply requested updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: marker not found in {path}')
              p.write_text(s.replace(old,new,1))

          # 1 + 5: molecular drawing — strict freeform lasso, organized controls, expandable canvas.
          p=Path('chemistry-editor.js'); s=p.read_text()
          old='''  let textDefaults={...DEFAULT_TEXT_STYLE};\n  let undoStack=[],redoStack=[];\n  const HISTORY_LIMIT=80;\n'''
          new='''  let textDefaults={...DEFAULT_TEXT_STYLE};\n  let undoStack=[],redoStack=[];\n  const HISTORY_LIMIT=80;\n  const DEFAULT_CANVAS_VIEW={x:0,y:0,width:820,height:470};\n  let canvasView={...DEFAULT_CANVAS_VIEW};\n\n  function canvasViewBox(){return [canvasView.x,canvasView.y,canvasView.width,canvasView.height].map(v=>Number(v.toFixed(2))).join(" ");}\n  function applyCanvasView(){if(svg)svg.setAttribute("viewBox",canvasViewBox());}\n  function resetCanvasView(){canvasView={...DEFAULT_CANVAS_VIEW};applyCanvasView();}\n  function expandCanvas(){\n    const cx=canvasView.x+canvasView.width/2,cy=canvasView.y+canvasView.height/2;\n    canvasView.width=Math.min(4000,canvasView.width*1.35);canvasView.height=Math.min(2600,canvasView.height*1.35);\n    canvasView.x=cx-canvasView.width/2;canvasView.y=cy-canvasView.height/2;applyCanvasView();\n    if(status)status.textContent="Canvas expanded. Keep drawing; the workspace can grow again whenever you need more room.";\n  }\n  function fitCanvasToDrawing(announce=true){\n    if(!graph.atoms.length){resetCanvasView();if(announce&&status)status.textContent="Canvas centered at the default size.";return;}\n    const pad=85,minX=Math.min(...graph.atoms.map(a=>a.x))-pad,maxX=Math.max(...graph.atoms.map(a=>a.x))+pad,minY=Math.min(...graph.atoms.map(a=>a.y))-pad,maxY=Math.max(...graph.atoms.map(a=>a.y))+pad;\n    const width=Math.max(DEFAULT_CANVAS_VIEW.width,maxX-minX),height=Math.max(DEFAULT_CANVAS_VIEW.height,maxY-minY),cx=(minX+maxX)/2,cy=(minY+maxY)/2;\n    canvasView={x:cx-width/2,y:cy-height/2,width,height};applyCanvasView();\n    if(announce&&status)status.textContent="Canvas fitted to the current drawing.";\n  }\n  function ensureCanvasContainsDrawing(){\n    if(!graph.atoms.length)return;\n    const margin=70,left=Math.min(...graph.atoms.map(a=>a.x))-margin,right=Math.max(...graph.atoms.map(a=>a.x))+margin,top=Math.min(...graph.atoms.map(a=>a.y))-margin,bottom=Math.max(...graph.atoms.map(a=>a.y))+margin;\n    const oldRight=canvasView.x+canvasView.width,oldBottom=canvasView.y+canvasView.height,newX=Math.min(canvasView.x,left),newY=Math.min(canvasView.y,top),newRight=Math.max(oldRight,right),newBottom=Math.max(oldBottom,bottom);\n    if(newX!==canvasView.x||newY!==canvasView.y||newRight!==oldRight||newBottom!==oldBottom){canvasView={x:newX,y:newY,width:newRight-newX,height:newBottom-newY};applyCanvasView();}\n  }\n\n  function organizeChemistryControls(){\n    const toolbar=dialog?.querySelector(".chem-editor-toolbar");if(!toolbar||toolbar.dataset.grouped)return;toolbar.dataset.grouped="true";\n    const button=(id,text,title)=>{const b=document.createElement("button");b.type="button";b.id=id;b.textContent=text;b.title=title||text;toolbar.append(b);return b;};\n    button("chemExpandCanvas","More canvas","Expand the molecular drawing workspace");\n    button("chemFitCanvas","Fit drawing","Fit the canvas around the current drawing");\n    const groups=[\n      ["History",["#chemUndoButton","#chemRedoButton"]],\n      ["Select · Atoms & groups",['[data-chem-tool="select"]','[data-chem-tool="lasso"]',"#chemSelectAll"]],\n      ["Build · Atoms & bonds",['[data-chem-tool="atom"]','[data-chem-tool="bond"]','[data-chem-tool="fuse"]','[data-chem-tool="hbond"]','[data-chem-tool="delete"]',"#chemRingTemplate","#chemInsertRing"]],\n      ["Display · Labels & chemistry",["#chemAtomCirclesToggle","#chemAtomLabelsToggle","#chemAtomNumbersToggle","#chemElement","#chemBondOrder","#chemChargeMinus","#chemChargePlus","#chemIupacButton"]],\n      ["View · Canvas",["#chemExpandCanvas","#chemFitCanvas"]]\n    ];\n    groups.forEach(([name,selectors],index)=>{\n      const details=document.createElement("details");details.className="chem-tool-group";details.open=index<3;const summary=document.createElement("summary");summary.textContent=name;const body=document.createElement("div");body.className="chem-tool-group-body";details.append(summary,body);\n      selectors.forEach(selector=>{let el=toolbar.querySelector(selector);if(el&&el.tagName==="SELECT")el=el.closest("label");if(el&&!body.contains(el))body.append(el);});toolbar.append(details);\n    });\n    const text=dialog.querySelector(".chem-text-controls > strong");if(text)text.textContent="Display · Text";\n  }\n'''
          if old not in s: raise SystemExit('chem state marker not found')
          s=s.replace(old,new,1)

          s=s.replace('''    document.body.append(dialog);\n    const exportDialog=document.createElement("dialog");''','''    document.body.append(dialog);\n    organizeChemistryControls();\n    const exportDialog=document.createElement("dialog");''',1)

          s=s.replace('''    dialog.querySelector("#chemRedoButton").addEventListener("click",redo);\n''','''    dialog.querySelector("#chemRedoButton").addEventListener("click",redo);\n    dialog.querySelector("#chemExpandCanvas").addEventListener("click",expandCanvas);\n    dialog.querySelector("#chemFitCanvas").addEventListener("click",()=>fitCanvasToDrawing(true));\n''',1)

          old='''  function lassoContainsAtom(atom,poly,radius=19){\n    const center={x:atom.x,y:atom.y};if(pointInPolygon(center,poly))return true;\n    for(let i=0;i<poly.length;i++)if(distancePointToSegment(center,poly[i],poly[(i+1)%poly.length])<=radius)return true;\n    return false;\n  }'''
          new='''  function lassoContainsAtom(atom,poly){\n    // True lasso semantics: selection follows the freeform polygon itself.\n    // The transform rectangle shown afterward is only a handle box and never\n    // adds atoms that were outside the lasso path.\n    return pointInPolygon({x:atom.x,y:atom.y},poly);\n  }'''
          if old not in s: raise SystemExit('lasso marker not found')
          s=s.replace(old,new,1)

          old='''  function ringInsertCenter(){\n    if(!graph.atoms.length)return {x:410,y:235};\n    const maxX=Math.max(...graph.atoms.map(a=>a.x)),minX=Math.min(...graph.atoms.map(a=>a.x));\n    if(maxX<650)return {x:Math.min(650,maxX+105),y:235};\n    if(minX>170)return {x:Math.max(100,minX-105),y:235};\n    return {x:410,y:235};\n  }'''
          new='''  function ringInsertCenter(){\n    const center={x:canvasView.x+canvasView.width/2,y:canvasView.y+canvasView.height/2};\n    if(!graph.atoms.length)return center;\n    const maxX=Math.max(...graph.atoms.map(a=>a.x)),minX=Math.min(...graph.atoms.map(a=>a.x));\n    if(maxX<center.x+canvasView.width*.28)return {x:maxX+105,y:center.y};\n    if(minX>center.x-canvasView.width*.28)return {x:minX-105,y:center.y};\n    return center;\n  }'''
          if old not in s: raise SystemExit('ring center marker not found')
          s=s.replace(old,new,1)

          s=s.replace('''    return {x:clamp(origin.x+Math.cos(angle)*length,22,798),y:clamp(origin.y+Math.sin(angle)*length,22,448)};''','''    return {x:origin.x+Math.cos(angle)*length,y:origin.y+Math.sin(angle)*length};''',1)

          s=s.replace('''      graph.atoms.push({id,element,x:p.x,y:p.y,charge:0,label:element,textStyle:{...textDefaults}});\n      invalidateIupac();selectAtoms([id],id);render();validate();return;''','''      graph.atoms.push({id,element,x:p.x,y:p.y,charge:0,label:element,textStyle:{...textDefaults}});\n      ensureCanvasContainsDrawing();invalidateIupac();selectAtoms([id],id);render();validate();return;''',1)
          s=s.replace('''      graph.atoms.push({id,element,x:p.x,y:p.y,charge:0,label:element,textStyle:{...textDefaults}});\n      graph.bonds.push({id:"b"+bondSerial++,a:pendingAtom,b:id,order:bondOrder});pendingAtom=null;invalidateIupac();selectAtoms([id],id);render();validate();status.textContent="New atom placed at a geometry-aware bond angle. Drag it if you want a different arrangement.";return;''','''      graph.atoms.push({id,element,x:p.x,y:p.y,charge:0,label:element,textStyle:{...textDefaults}});\n      graph.bonds.push({id:"b"+bondSerial++,a:pendingAtom,b:id,order:bondOrder});pendingAtom=null;ensureCanvasContainsDrawing();invalidateIupac();selectAtoms([id],id);render();validate();status.textContent="New atom placed at a geometry-aware bond angle. Drag it if you want a different arrangement.";return;''',1)

          old='''      const p=point(e),dx0=p.x-drag.last.x,dy0=p.y-drag.last.y;\n      const atoms=drag.ids.map(atomById).filter(Boolean);if(!atoms.length)return;\n      const minX=Math.min(...atoms.map(a=>a.x)),maxX=Math.max(...atoms.map(a=>a.x)),minY=Math.min(...atoms.map(a=>a.y)),maxY=Math.max(...atoms.map(a=>a.y));\n      const dx=clamp(dx0,24-minX,796-maxX),dy=clamp(dy0,24-minY,446-maxY);\n      atoms.forEach(a=>{a.x+=dx;a.y+=dy;});drag.last=p;render();return;'''
          new='''      const p=point(e),dx=p.x-drag.last.x,dy=p.y-drag.last.y;\n      const atoms=drag.ids.map(atomById).filter(Boolean);if(!atoms.length)return;\n      atoms.forEach(a=>{a.x+=dx;a.y+=dy;});drag.last=p;render();return;'''
          if old not in s: raise SystemExit('drag clamp marker not found')
          s=s.replace(old,new,1)
          s=s.replace('''    if(drag&&e.pointerId===drag.pointer){drag=null;if(svg.hasPointerCapture?.(e.pointerId))svg.releasePointerCapture(e.pointerId);validate();return;}''','''    if(drag&&e.pointerId===drag.pointer){drag=null;if(svg.hasPointerCapture?.(e.pointerId))svg.releasePointerCapture(e.pointerId);ensureCanvasContainsDrawing();render();validate();return;}''',1)

          s=s.replace('''  function loadCurrent(){\n    graph=mode==="base"?graphFromBase(base):mode==="pair"?mergePair(leftBase,rightBase):{atoms:[],bonds:[],hbonds:[],iupac:null};\n    renumber();render();validate();\n  }''','''  function loadCurrent(){\n    graph=mode==="base"?graphFromBase(base):mode==="pair"?mergePair(leftBase,rightBase):{atoms:[],bonds:[],hbonds:[],iupac:null};\n    resetCanvasView();renumber();fitCanvasToDrawing(false);render();validate();\n  }''',1)

          s=s.replace('''  function render(){\n    if(!svg)return;\n    svg.innerHTML="";''','''  function render(){\n    if(!svg)return;\n    applyCanvasView();svg.innerHTML="";''',1)

          s=s.replace('''      await ExportTools.exportSvgElement(svg,{format,filename:label,scale,background,viewBox:"0 0 820 470"});''','''      await ExportTools.exportSvgElement(svg,{format,filename:label,scale,background,viewBox:canvasViewBox()});''',1)
          s=s.replace('''const result=await ExportTools.exportSvgElement(svg,{format,filename,scale,background,viewBox:svg.getAttribute("viewBox")||"0 0 820 470"});''','''const result=await ExportTools.exportSvgElement(svg,{format,filename,scale,background,viewBox:canvasViewBox()});''',1)

          s=s.replace('''    graph=graphFromBase(base);renumber();resetUndoHistory();render();validate();dialog.showModal();''','''    graph=graphFromBase(base);resetCanvasView();renumber();fitCanvasToDrawing(false);resetUndoHistory();render();validate();dialog.showModal();''',1)
          s=s.replace('''    renumber();resetUndoHistory();render();validate();dialog.showModal();\n  }\n  function openBlank''','''    resetCanvasView();renumber();fitCanvasToDrawing(false);resetUndoHistory();render();validate();dialog.showModal();\n  }\n  function openBlank''',1)
          s=s.replace('''    graph={atoms:[],bonds:[],hbonds:[],iupac:null};renumber();resetUndoHistory();render();validate();''','''    graph={atoms:[],bonds:[],hbonds:[],iupac:null};resetCanvasView();renumber();resetUndoHistory();render();validate();''',1)
          s=s.replace('''      status.textContent=count?`Lasso selected ${count} atom${count===1?"":"s"}. Drag the selection or use the resize/rotate handles.`:"No atoms were inside the lasso. Try drawing a wider loop around the atom centers.";''','''      status.textContent=count?`Lasso selected ${count} atom${count===1?"":"s"} inside the freeform path. The rectangle is only a transform handle and does not add enclosed unselected atoms.`:"No atom centers were inside the lasso. Draw the loop around the atoms you want to select.";''',1)
          p.write_text(s)

          # 4: only the newly formed bond animates at each learning step.
          p=Path('chemistry.js'); s=p.read_text()
          s=s.replace('''  else b('p','o5',1,'formed phosphate-bond');''','''  else b('p','o5',1,'formed phosphate-bond step-new');''',1)
          s=s.replace('''  else b('c1','n',1,'formed glycosidic-bond');''','''  else b('c1','n',1,step===1?'formed glycosidic-bond step-new':'formed glycosidic-bond prior-formed');''',1)
          p.write_text(s)

          p=Path('styles.css'); s=p.read_text()
          s=s.replace('.animate-reaction .formed { animation: bond-appear .7s ease both; }','.animate-reaction .step-new { animation: bond-appear .7s ease both; }',1)
          s=s.replace('.animate-reaction .formed line:not(.bond-hit) { stroke-dasharray: 160; animation: draw-connection 1s ease both; }','.animate-reaction .step-new line:not(.bond-hit) { stroke-dasharray: 160; animation: draw-connection 1s ease both; }',1)
          old='.growth-svg .inter-nucleotide-link{stroke:var(--mint);stroke-width:4;stroke-dasharray:120;animation:draw-growth-link .8s ease both}'
          new='.growth-svg .inter-nucleotide-link{stroke:var(--mint);stroke-width:4}\n.growth-svg .new-growth-link .inter-nucleotide-link{stroke-dasharray:120;animation:draw-growth-link .8s ease both}'
          if old not in s: raise SystemExit('primary animation CSS marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2: consistent, navigable control categories in 2D/3D.
          p=Path('app.js'); s=p.read_text()
          start=s.index('function setupModernWorkspaceUi(){')
          end=s.index('\nfunction applyPageMode()',start)
          new_func=r'''function setupModernWorkspaceUi(){
  document.querySelectorAll("[data-controls-toggle]").forEach(button=>{
    const scene=document.getElementById("scene-"+button.dataset.controlsToggle);
    if(!scene)return;
    const sync=()=>{
      const collapsed=scene.classList.contains("controls-collapsed");
      button.setAttribute("aria-expanded",String(!collapsed));
      const icon=button.querySelector("span"),label=button.querySelector("b");
      if(icon)icon.textContent=collapsed?"›":"‹";
      if(label)label.textContent=collapsed?"Show":"Controls";
    };
    button.addEventListener("click",()=>{scene.classList.toggle("controls-collapsed");sync();});
    sync();
  });

  const secondaryControls=document.querySelector("#scene-secondary .se-controls");
  if(secondaryControls&&!secondaryControls.closest(".workspace-advanced-panel")){
    const advanced=document.createElement("details");advanced.className="workspace-advanced-panel";advanced.open=true;
    const summary=document.createElement("summary");summary.textContent="Controls · Structure, display & analysis";
    secondaryControls.before(advanced);advanced.append(summary,secondaryControls);
  }

  const tertiaryControls=document.querySelector("#scene-tertiary .te-controls");
  if(tertiaryControls&&!tertiaryControls.querySelector(":scope > .workspace-advanced-panel")){
    const details=[...tertiaryControls.children].filter(el=>el.tagName==="DETAILS");
    details.slice(0,2).forEach(el=>el.open=false);
    if(details.length>2){
      const advanced=document.createElement("details");advanced.className="workspace-advanced-panel";advanced.open=true;
      const summary=document.createElement("summary");summary.textContent="More · Selection, analysis & view";advanced.append(summary);
      details.slice(2).forEach(el=>advanced.append(el));tertiaryControls.append(advanced);
    }
  }

  const renameSummaries=(root,map)=>{
    if(!root)return;
    root.querySelectorAll("summary").forEach(summary=>{
      const key=summary.textContent.trim();if(map[key])summary.textContent=map[key];
    });
  };
  renameSummaries(secondaryControls,{
    "Analyze · Data layers":"Analyze · Data layers",
    "Display · Backbone":"Display · Backbone",
    "Display · Residues":"Display · Residues",
    "Analyze · Base pairs":"Analyze · Base pairs",
    "Display · Residue index":"Display · Residue index"
  });
  renameSummaries(tertiaryControls,{
    "Import structure & 2D/3D mapping":"Import · Structure & mapping",
    "Display":"Display · Structure",
    "Select · sequence & ranges":"Select · Residues & ranges",
    "Saved objects":"Select · Saved objects",
    "Residue index":"Display · Residue index",
    "Analyze · measurements & contacts":"Analyze · Measurements & contacts",
    "Clipping":"View · Clipping",
    "Compare / align structures":"Analyze · Compare / align structures",
    "Saved camera views":"View · Saved camera views",
    "Focus on structural region":"View · Focus on structural region"
  });

  const addControlNavigator=(root,labels)=>{
    if(!root||root.querySelector(":scope > .workspace-control-map"))return;
    const nav=document.createElement("nav");nav.className="workspace-control-map";nav.setAttribute("aria-label","Control categories");
    labels.forEach(label=>{
      const button=document.createElement("button");button.type="button";button.textContent=label;
      button.addEventListener("click",()=>{
        const summary=[...root.querySelectorAll("summary")].find(s=>s.textContent.trim().startsWith(label+" ·"));
        if(!summary)return;
        let node=summary.parentElement;while(node&&node!==root){if(node.tagName==="DETAILS")node.open=true;node=node.parentElement;}
        summary.parentElement.open=true;summary.scrollIntoView({behavior:"smooth",block:"nearest"});
      });nav.append(button);
    });
    root.prepend(nav);
  };
  addControlNavigator(secondaryControls,["Display","Analyze"]);
  addControlNavigator(tertiaryControls,["Import","Select","Display","Analyze","View"]);
}
'''
          s=s[:start]+new_func+s[end:]
          # Contextual tutorial button on drawing launchers.
          marker='''  launcher.hidden=false;\n  actions.replaceChildren();\n'''
          repl='''  launcher.hidden=false;\n  actions.replaceChildren();\n  launcher.querySelector(".workspace-tutorial-button")?.remove();\n  const tutorialButton=document.createElement("button");tutorialButton.type="button";tutorialButton.className="workspace-tutorial-button secondary-action";tutorialButton.dataset.rnaTutorial=page; tutorialButton.textContent="? Quick tutorial";\n  description.insertAdjacentElement("afterend",tutorialButton);\n'''
          if marker not in s: raise SystemExit('workspace launcher marker not found')
          s=s.replace(marker,repl,1)
          p.write_text(s)

          # 6 + 7: engaging tutorials and Learn/Practice flashcards.
          p=Path('index.html'); s=p.read_text()
          s=s.replace('''            <a href="?page=journey&scene=tertiary"><strong>06</strong> Tertiary structure</a>\n          </div>''','''            <a href="?page=journey&scene=tertiary"><strong>06</strong> Tertiary structure</a>\n            <a href="./#tutorials"><strong>→</strong> Tutorials <small>Try guided examples</small></a>\n            <a href="./#rnaPractice"><strong>✓</strong> Practice <small>RNA flashcards</small></a>\n          </div>''',1)

          home_insert=r'''
      <section class="home-discovery" id="tutorials" aria-labelledby="homeDiscoveryTitle">
        <div class="home-section-heading">
          <p class="eyebrow">Try it now</p>
          <h2 id="homeDiscoveryTitle">What can I do with RNA Explorer?</h2>
          <p>Pick a short guided example. Each tutorial explains the goal in a few steps, then opens the real workspace so you can try it yourself.</p>
        </div>
        <div class="home-tutorial-grid">
          <article class="home-tutorial-card"><span>01</span><h3>Draw & edit RNA chemistry</h3><p>Start from a nucleobase or blank canvas, select atoms with a true lasso, change bonds and charges, and export the drawing.</p><button type="button" data-rna-tutorial="drawing">Start drawing tutorial</button></article>
          <article class="home-tutorial-card"><span>02</span><h3>Explore a 2D structure</h3><p>Load the tRNA example, switch layouts, style residues and base pairs, and add reactivity or base-pair probability data.</p><button type="button" data-rna-tutorial="secondary">Start 2D tutorial</button></article>
          <article class="home-tutorial-card"><span>03</span><h3>Inspect RNA in 3D</h3><p>Rotate the 1EHZ tRNA, select residues, inspect structural features, measure geometry, and link the 3D structure to 2D.</p><button type="button" data-rna-tutorial="tertiary">Start 3D tutorial</button></article>
          <article class="home-tutorial-card practice-card"><span>04</span><h3>Practice what you learned</h3><p>Use quick RNA flashcards to review building blocks, bonding, secondary structure, and tertiary structure.</p><a href="#rnaPractice">Practice flashcards ↓</a></article>
        </div>
      </section>

      <section class="rna-practice" id="rnaPractice" aria-labelledby="rnaPracticeTitle">
        <div class="home-section-heading">
          <p class="eyebrow">Learn · Practice</p>
          <h2 id="rnaPracticeTitle">RNA structure flashcards</h2>
          <p>Flip a card, mark whether you knew it, and move through the deck. This first deck is intentionally short; more topic-specific decks can be added later.</p>
        </div>
        <div class="flashcard-shell" aria-live="polite">
          <div class="flashcard-progress"><span id="flashcardProgress">1 / 10</span><span id="flashcardScore">Known 0 · Review 0</span></div>
          <button class="rna-flashcard" id="rnaFlashcard" type="button" aria-pressed="false" aria-label="Flip flashcard">
            <span class="flashcard-side-label" id="flashcardSideLabel">Question</span>
            <strong id="flashcardText">What are the four standard RNA bases?</strong>
            <small>Tap to flip</small>
          </button>
          <div class="flashcard-actions">
            <button type="button" id="flashcardPrevious">← Previous</button>
            <button type="button" id="flashcardFlip">Flip card</button>
            <button type="button" id="flashcardReview">Review again</button>
            <button type="button" id="flashcardKnow">I know this ✓</button>
            <button type="button" id="flashcardNext">Next →</button>
          </div>
        </div>
      </section>
'''
          marker='''      <section class="workspace-launcher" id="workspaceLauncher" aria-labelledby="workspaceLauncherTitle" hidden>'''
          if marker not in s: raise SystemExit('home insertion marker not found')
          s=s.replace(marker,home_insert+'\n'+marker,1)

          s=s.replace('''            <button class="workspace-controls-toggle" type="button" data-controls-toggle="secondary" aria-expanded="true" aria-controls="secondaryControlContent"><span aria-hidden="true">‹</span><b>Controls</b></button>''','''            <div class="workspace-heading-actions"><button class="workspace-controls-toggle" type="button" data-controls-toggle="secondary" aria-expanded="true" aria-controls="secondaryControlContent"><span aria-hidden="true">‹</span><b>Controls</b></button><button class="workspace-help-button" type="button" data-rna-tutorial="secondary">? Tutorial</button></div>''',1)
          s=s.replace('''            <button class="workspace-controls-toggle" type="button" data-controls-toggle="tertiary" aria-expanded="true" aria-controls="tertiaryControls"><span aria-hidden="true">‹</span><b>Controls</b></button>''','''            <div class="workspace-heading-actions"><button class="workspace-controls-toggle" type="button" data-controls-toggle="tertiary" aria-expanded="true" aria-controls="tertiaryControls"><span aria-hidden="true">‹</span><b>Controls</b></button><button class="workspace-help-button" type="button" data-rna-tutorial="tertiary">? Tutorial</button></div>''',1)

          tutorial_dialog=r'''
  <dialog id="rnaTutorialDialog" class="rna-tutorial-dialog" aria-labelledby="rnaTutorialTitle">
    <button class="dialog-close" id="rnaTutorialClose" aria-label="Close tutorial">×</button>
    <p class="eyebrow">Quick tutorial</p>
    <h2 id="rnaTutorialTitle">RNA Explorer tutorial</h2>
    <p id="rnaTutorialIntro"></p>
    <div class="tutorial-step" id="rnaTutorialStep"></div>
    <div class="tutorial-progress" id="rnaTutorialProgress"></div>
    <div class="tutorial-actions"><button type="button" id="rnaTutorialPrevious">← Previous</button><button type="button" id="rnaTutorialNext">Next →</button><a id="rnaTutorialOpen" class="primary-action" href="?page=journey">Open workspace</a></div>
