name: Refine selection boxes

on:
  push:
    paths:
      - '.github/workflows/refine-selection-boxes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply selection box updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Secondary structure: keep transform box visible after box/lasso selection,
          # mirror the molecular drawing handles, and show live/persistent zoom percent.
          p=Path('secondary-selection-tools.js')
          s=p.read_text()
          old='''  function drawGestureOverlay(){const root=$("secondarySvg");if(!root||!gesture)return;removeOverlay();if(mode==="box"){'''
          new='''  function drawGestureOverlay(){const root=$("secondarySvg");if(!root||!gesture)return;root.querySelectorAll(".se-selected-transform-overlay").forEach(el=>el.remove());removeOverlay();if(mode==="box"){'''
          if old not in s: raise SystemExit('secondary drawGestureOverlay anchor missing')
          s=s.replace(old,new,1)

          old='''  function drawSelectedTransformOverlay(){const root=$("secondarySvg");if(!root)return;root.querySelectorAll(".se-selected-transform-overlay").forEach(el=>el.remove());if(mode||gesture)return;const b=selectedBounds();if(!b)return;const pad=28,x=b.minX-pad,y=b.minY-pad,w=Math.max(52,b.maxX-b.minX+pad*2),h=Math.max(52,b.maxY-b.minY+pad*2),cx=x+w/2;const layer=document.createElementNS(svgNS,"g");layer.setAttribute("class","se-selected-transform-overlay");layer.setAttribute("data-export-remove","");const rect=document.createElementNS(svgNS,"rect");Object.entries({x,y,width:w,height:h,rx:5}).forEach(([k,v])=>rect.setAttribute(k,v));rect.setAttribute("class","se-selected-transform-box");layer.append(rect);const stem=document.createElementNS(svgNS,"line");Object.entries({x1:cx,y1:y,x2:cx,y2:y-32}).forEach(([k,v])=>stem.setAttribute(k,v));stem.setAttribute("class","se-transform-stem");layer.append(stem);[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([hx,hy])=>{const c=document.createElementNS(svgNS,"circle");c.dataset.seTransformHandle="scale";c.setAttribute("cx",hx);c.setAttribute("cy",hy);c.setAttribute("r",7);c.setAttribute("class","se-transform-handle se-scale-handle");layer.append(c);});const rotate=document.createElementNS(svgNS,"circle");rotate.dataset.seTransformHandle="rotate";rotate.setAttribute("cx",cx);rotate.setAttribute("cy",y-32);rotate.setAttribute("r",8);rotate.setAttribute("class","se-transform-handle se-rotate-handle");layer.append(rotate);if(transformGesture?.kind==="rotate"){const label=document.createElementNS(svgNS,"text");label.setAttribute("x",cx+14);label.setAttribute("y",y-36);label.setAttribute("class","se-rotation-angle");label.textContent=Math.round(transformGesture.liveRotation)+"°";layer.append(label);}root.append(layer);}'''
          new='''  function drawSelectedTransformOverlay(){const root=$("secondarySvg");if(!root)return;root.querySelectorAll(".se-selected-transform-overlay").forEach(el=>el.remove());if(gesture)return;const b=selectedBounds();if(!b)return;const pad=22,x=b.minX-pad,y=b.minY-pad,w=Math.max(24,b.maxX-b.minX+pad*2),h=Math.max(24,b.maxY-b.minY+pad*2),cx=x+w/2;const layer=document.createElementNS(svgNS,"g");layer.setAttribute("class","se-selected-transform-overlay");layer.setAttribute("data-export-remove","");const rect=document.createElementNS(svgNS,"rect");Object.entries({x,y,width:w,height:h,rx:4}).forEach(([k,v])=>rect.setAttribute(k,v));rect.setAttribute("class","se-selected-transform-box");layer.append(rect);const stem=document.createElementNS(svgNS,"line");Object.entries({x1:cx,y1:y,x2:cx,y2:y-30}).forEach(([k,v])=>stem.setAttribute(k,v));stem.setAttribute("class","se-transform-stem");layer.append(stem);[["nw",x,y],["ne",x+w,y],["se",x+w,y+h],["sw",x,y+h]].forEach(([name,hx,hy])=>{const c=document.createElementNS(svgNS,"circle");c.dataset.seTransformHandle=name;c.setAttribute("cx",hx);c.setAttribute("cy",hy);c.setAttribute("r",7);c.setAttribute("class","se-transform-handle se-scale-handle se-scale-handle-"+name);layer.append(c);});const rotate=document.createElementNS(svgNS,"circle");rotate.dataset.seTransformHandle="rotate";rotate.setAttribute("cx",cx);rotate.setAttribute("cy",y-30);rotate.setAttribute("r",8);rotate.setAttribute("class","se-transform-handle se-rotate-handle");layer.append(rotate);if(transformGesture?.kind==="rotate"){const label=document.createElementNS(svgNS,"text");label.setAttribute("x",cx+14);label.setAttribute("y",y-34);label.setAttribute("class","se-rotation-angle");label.textContent=Math.round(transformGesture.liveRotation)+"°";layer.append(label);}const state=SecondaryExplorer?.getTransformState?.()||{selectionScale:1};const zoom=document.createElementNS(svgNS,"text");zoom.setAttribute("x",x+w-8);zoom.setAttribute("y",y+h-9);zoom.setAttribute("text-anchor","end");zoom.setAttribute("class","se-transform-zoom-label");zoom.setAttribute("pointer-events","none");zoom.textContent=Math.round((Number(state.selectionScale)||1)*100)+"%";layer.append(zoom);root.append(layer);}'''
          if old not in s: raise SystemExit('secondary transform overlay anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('secondary-selection-tools.css')
          s=p.read_text()
          old='''.se-selected-transform-box{fill:none;stroke:#f2c66d;stroke-width:1.6;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}.se-transform-stem{stroke:#f2c66d;stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}.se-transform-handle{stroke:#07111c;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}.se-scale-handle{fill:#07111c;stroke:#f2c66d;cursor:nwse-resize}.se-rotate-handle{fill:#f2c66d;cursor:grab}.se-rotation-angle{fill:#f5e9c8;font:700 14px "DM Mono",monospace;paint-order:stroke;stroke:#07111c;stroke-width:4px;stroke-linejoin:round;pointer-events:none}'''
          new='''.se-selected-transform-box{fill:none;stroke:#f2c66d;stroke-width:1.6;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}.se-transform-stem{stroke:#f2c66d;stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}.se-transform-handle{stroke:#07111c;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}.se-scale-handle{fill:#07111c;stroke:#f2c66d}.se-scale-handle-nw{cursor:nw-resize}.se-scale-handle-ne{cursor:ne-resize}.se-scale-handle-se{cursor:se-resize}.se-scale-handle-sw{cursor:sw-resize}.se-rotate-handle{fill:#f2c66d;cursor:grab}.se-rotation-angle,.se-transform-zoom-label{fill:#f5e9c8;font:700 14px "DM Mono",monospace;paint-order:stroke;stroke:#07111c;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.se-transform-zoom-label{font-size:12px}'''
          if old not in s: raise SystemExit('secondary transform CSS anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Molecular drawing: retain a cumulative zoom value for the active selection
          # and display it in the same transform box as the live rotation angle.
          p=Path('chemistry-editor.js')
          s=p.read_text()
          old='''  let graph={atoms:[],bonds:[],hbonds:[]},tool="select",element="C",bondOrder=1,selectedAtom=null,selectedAtoms=new Set(),pendingAtom=null,drag=null,selectionBox=null,lasso=null,transformDrag=null,pendingFuseBond=null,onSave=null;'''
          new='''  let graph={atoms:[],bonds:[],hbonds:[]},tool="select",element="C",bondOrder=1,selectedAtom=null,selectedAtoms=new Set(),pendingAtom=null,drag=null,selectionBox=null,lasso=null,transformDrag=null,selectionZoom=1,pendingFuseBond=null,onSave=null;'''
          if old not in s: raise SystemExit('chem state anchor missing')
          s=s.replace(old,new,1)

          old='''    selectedAtom=null;selectedAtoms.clear();pendingAtom=null;pendingFuseBond=null;drag=null;transformDrag=null;selectionBox=null;lasso=null;'''
          new='''    selectedAtom=null;selectedAtoms.clear();pendingAtom=null;pendingFuseBond=null;drag=null;transformDrag=null;selectionZoom=1;selectionBox=null;lasso=null;'''
          if old not in s: raise SystemExit('chem restore history anchor missing')
          s=s.replace(old,new,1)

          old='''    selectedAtom=null;selectedAtoms.clear();pendingAtom=null;pendingFuseBond=null;drag=null;transformDrag=null;selectionBox=null;lasso=null;\n  }\n  function selectAtoms(ids,activeId=null){\n    selectedAtoms=new Set(ids.filter(id=>atomById(id)));'''
          new='''    selectedAtom=null;selectedAtoms.clear();pendingAtom=null;pendingFuseBond=null;drag=null;transformDrag=null;selectionZoom=1;selectionBox=null;lasso=null;\n  }\n  function selectAtoms(ids,activeId=null){\n    selectionZoom=1;selectedAtoms=new Set(ids.filter(id=>atomById(id)));'''
          if old not in s: raise SystemExit('chem renumber/select anchor missing')
          s=s.replace(old,new,1)

          old='''  function toggleAtom(id){\n    if(selectedAtoms.has(id))selectedAtoms.delete(id);else selectedAtoms.add(id);'''
          new='''  function toggleAtom(id){\n    selectionZoom=1;if(selectedAtoms.has(id))selectedAtoms.delete(id);else selectedAtoms.add(id);'''
          if old not in s: raise SystemExit('chem toggle anchor missing')
          s=s.replace(old,new,1)

          old='''      if(e.key==="Escape"&&selectedAtoms.size){selectedAtoms.clear();selectedAtom=null;render();return;}'''
          new='''      if(e.key==="Escape"&&selectedAtoms.size){selectedAtoms.clear();selectedAtom=null;selectionZoom=1;render();return;}'''
          if old not in s: raise SystemExit('chem escape anchor missing')
          s=s.replace(old,new,1)

          old='''    const rotate=document.createElementNS(NS,"circle");rotate.dataset.transformHandle="rotate";rotate.setAttribute("cx",cx);rotate.setAttribute("cy",y-30);rotate.setAttribute("r","8");rotate.style.fill="#f2c66d";rotate.style.stroke="#07111c";rotate.style.strokeWidth="2";rotate.style.cursor="grab";layer.append(rotate);\n    if(transformDrag?.kind==="rotate"){const angle=document.createElementNS(NS,"text");angle.setAttribute("x",cx+14);angle.setAttribute("y",y-34);angle.setAttribute("class","chem-rotation-angle");angle.setAttribute("pointer-events","none");angle.textContent=Math.round(transformDrag.deltaDegrees||0)+"°";layer.append(angle);}\n    svg.append(layer);'''
          new='''    const rotate=document.createElementNS(NS,"circle");rotate.dataset.transformHandle="rotate";rotate.setAttribute("cx",cx);rotate.setAttribute("cy",y-30);rotate.setAttribute("r","8");rotate.style.fill="#f2c66d";rotate.style.stroke="#07111c";rotate.style.strokeWidth="2";rotate.style.cursor="grab";layer.append(rotate);\n    if(transformDrag?.kind==="rotate"){const angle=document.createElementNS(NS,"text");angle.setAttribute("x",cx+14);angle.setAttribute("y",y-34);angle.setAttribute("class","chem-rotation-angle");angle.setAttribute("pointer-events","none");angle.textContent=Math.round(transformDrag.deltaDegrees||0)+"°";layer.append(angle);}\n    const zoom=document.createElementNS(NS,"text");zoom.setAttribute("x",x+w-8);zoom.setAttribute("y",y+h-9);zoom.setAttribute("text-anchor","end");zoom.setAttribute("class","chem-transform-zoom");zoom.setAttribute("pointer-events","none");zoom.textContent=Math.round(selectionZoom*100)+"%";layer.append(zoom);\n    svg.append(layer);'''
          if old not in s: raise SystemExit('chem overlay label anchor missing')
          s=s.replace(old,new,1)

          old='''    transformDrag={pointer:pointerId,kind:handle==="rotate"?"rotate":"scale",center,original,startAngle:Math.atan2(dy,dx),startRadius:Math.max(8,Math.hypot(dx,dy)),deltaDegrees:0};return true;'''
          new='''    transformDrag={pointer:pointerId,kind:handle==="rotate"?"rotate":"scale",center,original,startAngle:Math.atan2(dy,dx),startRadius:Math.max(8,Math.hypot(dx,dy)),deltaDegrees:0,baseZoom:selectionZoom,liveScale:1};return true;'''
          if old not in s: raise SystemExit('chem begin transform anchor missing')
          s=s.replace(old,new,1)

          old='''    }else{\n      const scale=clamp(Math.hypot(dx,dy)/t.startRadius,.18,5);\n      t.original.forEach(o=>{const a=atomById(o.id);if(a){a.x=t.center.x+(o.x-t.center.x)*scale;a.y=t.center.y+(o.y-t.center.y)*scale;}});\n    }'''
          new='''    }else{\n      const scale=clamp(Math.hypot(dx,dy)/t.startRadius,.18,5);t.liveScale=scale;selectionZoom=t.baseZoom*scale;\n      t.original.forEach(o=>{const a=atomById(o.id);if(a){a.x=t.center.x+(o.x-t.center.x)*scale;a.y=t.center.y+(o.y-t.center.y)*scale;}});\n    }'''
          if old not in s: raise SystemExit('chem scale transform anchor missing')
          s=s.replace(old,new,1)

          old='''      const poly=current.points;if(!current.additive)selectedAtoms.clear();\n      if(poly.length>=3)graph.atoms.filter(a=>lassoContainsAtom(a,poly)).forEach(a=>selectedAtoms.add(a.id));\n      selectedAtom=[...selectedAtoms].at(-1)||null;'''
          new='''      const poly=current.points;if(!current.additive)selectedAtoms.clear();\n      if(poly.length>=3)graph.atoms.filter(a=>lassoContainsAtom(a,poly)).forEach(a=>selectedAtoms.add(a.id));\n      selectionZoom=1;selectedAtom=[...selectedAtoms].at(-1)||null;'''
          if old not in s: raise SystemExit('chem lasso selection anchor missing')
          s=s.replace(old,new,1)

          old='''      if(!additive)selectedAtoms.clear();ids.forEach(id=>selectedAtoms.add(id));selectedAtom=ids.at(-1)||selectedAtoms.values().next().value||null;'''
          new='''      if(!additive)selectedAtoms.clear();ids.forEach(id=>selectedAtoms.add(id));selectionZoom=1;selectedAtom=ids.at(-1)||selectedAtoms.values().next().value||null;'''
          if old not in s: raise SystemExit('chem box selection anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('chemistry-editor.css')
          s=p.read_text()
          old='''.chem-rotation-angle{fill:#f5e9c8;font:700 14px "DM Mono",monospace;paint-order:stroke;stroke:#07111c;stroke-width:4px;stroke-linejoin:round}'''
          new='''.chem-rotation-angle,.chem-transform-zoom{fill:#f5e9c8;font:700 14px "DM Mono",monospace;paint-order:stroke;stroke:#07111c;stroke-width:4px;stroke-linejoin:round}.chem-transform-zoom{font-size:12px}'''
          if old not in s: raise SystemExit('chem zoom CSS anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          replacements={
            'chemistry-editor.css?v=chem-editor-8':'chemistry-editor.css?v=chem-editor-9',
            'secondary-selection-tools.css?v=3':'secondary-selection-tools.css?v=4',
            'chemistry-editor.js?v=chem-editor-13':'chemistry-editor.js?v=chem-editor-14',
            'secondary-selection-tools.js?v=3':'secondary-selection-tools.js?v=4'
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit('index cache anchor missing: '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          print('PATCH_OK')
          PY

      - name: Validate JavaScript and patch markers
        run: |
          node --check secondary-selection-tools.js
          node --check chemistry-editor.js
          grep -q 'se-transform-zoom-label' secondary-selection-tools.js
          grep -q 'chem-transform-zoom' chemistry-editor.js
          grep -q 'if(gesture)return' secondary-selection-tools.js

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser test selection boxes
        run: |
          rm -rf dist && mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/
          python3 -m http.server 4173 --directory dist >/tmp/rna-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          try{
            // Secondary structure: transform box remains visible while selection mode stays active.
            await page.goto('http://127.0.0.1:4173/?page=secondary&start=example',{waitUntil:'networkidle'});
            await page.waitForSelector('#seTransformToolbar',{state:'visible'});
            await page.click('#seBoxSelectTool');
            await page.evaluate(()=>{SecondaryExplorer.highlightResidues([0,1,2,3]);window.dispatchEvent(new Event('rna-secondary-select'));});
            await page.waitForSelector('.se-selected-transform-overlay',{state:'visible'});
            if(await page.locator('#seBoxSelectTool').getAttribute('aria-pressed')!=='true')throw new Error('Secondary selection mode unexpectedly turned off');
            if(await page.locator('.se-scale-handle').count()!==4)throw new Error('Secondary transform box does not have four scale handles');
            if(await page.locator('.se-rotate-handle').count()!==1)throw new Error('Secondary transform box has no rotate handle');
            let label=(await page.locator('.se-transform-zoom-label').textContent())?.trim();
            if(label!=='100%')throw new Error('Secondary initial zoom label should be 100%, got '+label);
            const handle=page.locator('.se-scale-handle-se');const hb=await handle.boundingBox();if(!hb)throw new Error('Secondary scale handle not visible');
            await page.mouse.move(hb.x+hb.width/2,hb.y+hb.height/2);await page.mouse.down();await page.mouse.move(hb.x+hb.width/2+55,hb.y+hb.height/2+55,{steps:6});
            label=(await page.locator('.se-transform-zoom-label').textContent())?.trim();
            if(!label||label==='100%')throw new Error('Secondary zoom percent did not update during scale drag');
            await page.mouse.up();
            const secondaryScale=await page.evaluate(()=>SecondaryExplorer.getTransformState().selectionScale);
            if(!(secondaryScale>1))throw new Error('Secondary selection did not scale up');
            if(await page.locator('.se-selected-transform-overlay').count()!==1)throw new Error('Secondary transform box disappeared after scaling');

            // Molecular drawing: every transform box includes cumulative zoom percent.
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.evaluate(()=>MoleculeEditor.openBase('A'));
            await page.waitForSelector('#chemEditorDialog[open]',{state:'visible'});
            await page.click('#chemSelectAll');
            await page.waitForSelector('.chem-transform-overlay',{state:'visible'});
            let chemLabel=(await page.locator('.chem-transform-zoom').textContent())?.trim();
            if(chemLabel!=='100%')throw new Error('Molecular initial zoom label should be 100%, got '+chemLabel);
            const chemHandle=page.locator('[data-transform-handle="se"]');const cb=await chemHandle.boundingBox();if(!cb)throw new Error('Molecular scale handle not visible');
            await page.mouse.move(cb.x+cb.width/2,cb.y+cb.height/2);await page.mouse.down();await page.mouse.move(cb.x+cb.width/2+60,cb.y+cb.height/2+60,{steps:6});
            chemLabel=(await page.locator('.chem-transform-zoom').textContent())?.trim();
            if(!chemLabel||chemLabel==='100%')throw new Error('Molecular zoom percent did not update during scale drag');
            await page.mouse.up();
            const chemAfter=(await page.locator('.chem-transform-zoom').textContent())?.trim();
            if(!chemAfter||chemAfter==='100%')throw new Error('Molecular zoom percent did not persist after scaling');

            const serious=errors.filter(x=>!/favicon|ResizeObserver loop/i.test(x));if(serious.length)throw new Error('Browser errors:\n'+serious.join('\n'));
            console.log(JSON.stringify({result:'PASS',secondaryZoom:label,secondaryScale,molecularZoom:chemAfter}));
          } finally {await browser.close();}
          JS

      - name: Commit verified update and remove temporary workflow
        run: |
          rm .github/workflows/refine-selection-boxes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-selection-tools.js secondary-selection-tools.css chemistry-editor.js chemistry-editor.css index.html .github/workflows/refine-selection-boxes.yml
          git commit -m 'Match secondary selection box behavior and show zoom percent'
          git push
