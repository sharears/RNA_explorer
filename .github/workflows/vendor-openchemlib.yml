name: Vendor OpenChemLib assets

on:
  push:
    branches: [geometry-aware-3d-20261010]
    paths:
      - .github/workflows/vendor-openchemlib.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geometry-aware-3d-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download pinned OpenChemLib package
        run: |
          rm -rf /tmp/ocl-package /tmp/ocl.tgz
          mkdir -p /tmp/ocl-package vendor/openchemlib
          npm pack openchemlib@9.25.1 --pack-destination /tmp
          mv /tmp/openchemlib-9.25.1.tgz /tmp/ocl.tgz
          tar -xzf /tmp/ocl.tgz -C /tmp/ocl-package
          cp /tmp/ocl-package/package/dist/openchemlib.js vendor/openchemlib/openchemlib.js
          cp /tmp/ocl-package/package/dist/resources.json vendor/openchemlib/resources.json
          printf '%s\n' 'openchemlib 9.25.1 (BSD-3-Clause)' > vendor/openchemlib/VERSION.txt
      - name: Commit vendored browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/openchemlib
          if git diff --cached --quiet; then
            echo "Pinned OpenChemLib assets already present."
          else
            git commit -m "Vendor OpenChemLib 9.25.1 for browser 3D"
            git push origin HEAD:geometry-aware-3d-20261010
          fi
