name: Apply October mobile UI updates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-oct15-updates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate inspection, compact controls, chain info, and neutral viewer wording
        run: |
          node <<'NODE'
          const fs=require('fs');

          // Ensure the UI loader pulls the newest inspection code and the Oct 15 add-on.
          {
            const p='ui-fixes.js';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('chemistry-3d-measurements.js?v=20261014-1','chemistry-3d-measurements.js?v=20261015-2');
            if(!s.includes('function loadOct15Updates()')){
              const needle='  function initializeUiFixes() {';
              if(!s.includes(needle)) throw new Error('ui-fixes insertion point missing');
              const loader=`  function loadOct15Updates() {\n    if (document.querySelector('script[data-rna-oct15-updates="true"]')) return;\n    const script = document.createElement("script");\n    script.src = "oct15-ui-updates.js?v=20261015-2";\n    script.dataset.rnaOct15Updates = "true";\n    document.body.appendChild(script);\n  }\n\n`;
              s=s.replace(needle,loader+needle);
            }
            if(!s.includes('    loadOct15Updates();')){
              const call='    loadChemistryMeasurements();';
              if(!s.includes(call)) throw new Error('ui-fixes call point missing');
              s=s.replace(call,call+'\n    loadOct15Updates();');
            }
            fs.writeFileSync(p,s);
          }

          // Remove user-facing PyMOL branding while leaving internal identifiers alone.
          {
            const p='tertiary.js';
            let s=fs.readFileSync(p,'utf8');
            s=s.replaceAll('PyMOL-style sticks','Sticks');
            s=s.replaceAll('PyMOL-style stick representation colored by element','element-colored stick representation');
            fs.writeFileSync(p,s);
          }
          {
            const p='chemistry-3d-viewer.js';
            let s=fs.readFileSync(p,'utf8');
            s=s.replaceAll('PyMOL-style sticks','element-colored sticks');
            s=s.replaceAll('PyMOL-style viewer unavailable','Interactive molecular viewer unavailable');
            fs.writeFileSync(p,s);
          }

          // Bust the dynamic 3D viewer cache because its user-facing status text changed.
          {
            const p='chemistry-3d-openbabel.js';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('chemistry-3d-viewer.js?v=1','chemistry-3d-viewer.js?v=2');
            fs.writeFileSync(p,s);
          }

          // Bust top-level caches so browsers receive the new loaders immediately.
          {
            const p='index.html';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('chemistry-3d-openbabel.js?v=2','chemistry-3d-openbabel.js?v=3');
            s=s.replace('tertiary.js?v=tertiary-17','tertiary.js?v=tertiary-18');
            s=s.replace('ui-fixes.js?v=ui-fixes-4','ui-fixes.js?v=ui-fixes-5');
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Validate ui-fixes
        run: node --check ui-fixes.js
      - name: Validate October add-on
        run: node --check oct15-ui-updates.js
      - name: Validate measurement loader
        run: node --check chemistry-3d-measurements.js
      - name: Validate molecular 3D viewer
        run: node --check chemistry-3d-viewer.js
      - name: Validate geometry loader
        run: node --check chemistry-3d-openbabel.js
      - name: Validate tertiary workspace
        run: node --check tertiary.js
      - name: Commit activated updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add index.html ui-fixes.js tertiary.js chemistry-3d-viewer.js chemistry-3d-openbabel.js
          git commit -m "Activate mobile inspection and chain information updates"
          git push
