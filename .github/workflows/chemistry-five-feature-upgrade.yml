    const canvas=threeDCanvas,rect=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(320,Math.round(rect.width||640)),h=Math.max(280,Math.round(rect.height||500));
    if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#07111c';ctx.fillRect(0,0,w,h);
    if(!threeDCoords.length){ctx.fillStyle='#9cabb8';ctx.font='14px Manrope';ctx.textAlign='center';ctx.fillText('Draw a molecule to preview it in 3D.',w/2,h/2);return;}
    const pts=threeDCoords.map(rotate3DPoint),byId=new Map(pts.map(p=>[p.id,p])),maxR=Math.max(2,...pts.map(p=>Math.hypot(p.x,p.y))),s=Math.min(w,h)*0.34/maxR*threeDView.zoom,project=p=>({x:w/2+threeDView.panX+p.x*s,y:h/2+threeDView.panY-p.y*s,z:p.z});
    const bondDraw=graph.bonds.map(b=>({b,a:byId.get(b.a),c:byId.get(b.b)})).filter(x=>x.a&&x.c).sort((u,v)=>(u.a.z+u.c.z)-(v.a.z+v.c.z));
    bondDraw.forEach(({b,a,c})=>{const p=project(a),q=project(c),dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1,ox=-dy/len*3.2,oy=dx/len*3.2,order=Math.max(1,Math.min(3,Number(b.order||1))),offsets=order===1?[0]:order===2?[-1,1]:[-1.5,0,1.5];offsets.forEach(off=>{const grad=ctx.createLinearGradient(p.x,p.y,q.x,q.y);grad.addColorStop(0,ELEMENT_3D_COLORS[a.element]||'#aaaaaa');grad.addColorStop(1,ELEMENT_3D_COLORS[c.element]||'#aaaaaa');ctx.strokeStyle=grad;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x+ox*off,p.y+oy*off);ctx.lineTo(q.x+ox*off,q.y+oy*off);ctx.stroke();});});
    [...pts].sort((a,b)=>a.z-b.z).forEach(p=>{const q=project(p),r=p.element==='H'?6:9;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fillStyle=ELEMENT_3D_COLORS[p.element]||'#aaaaaa';ctx.fill();ctx.strokeStyle='rgba(5,10,16,.8)';ctx.lineWidth=1.5;ctx.stroke();});
  }
  function schedule3DRender(force=false){if(!threeDVisible)return;if(force&&threeDFrame){cancelAnimationFrame(threeDFrame);threeDFrame=0;}if(!threeDFrame)threeDFrame=requestAnimationFrame(()=>render3DPreview(force));}
  function toggle3DPreview(){
