name: Apply chemistry five-feature upgrade

on:
  push:
    branches: [chemistry-upgrade-20261009]
    paths:
      - .github/workflows/chemistry-five-feature-upgrade.yml
      - .github/scripts/chemistry_upgrade.py
      - .github/scripts/run_chemistry_upgrade.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chemistry-upgrade-20261009
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch molecular drawing workspace
        run: python3 .github/scripts/run_chemistry_upgrade.py
      - name: Syntax and chemistry regression tests
        run: |
          node --check chemistry-editor.js
          node tests/chemistry-editor.cjs
          node tests/chemistry.cjs
      - name: Verify feature markers
        run: |
          grep -q 'Show in 3D' chemistry-editor.js
          grep -q 'valence-warning' chemistry-editor.css
          grep -q 'Smart geometry: on' chemistry-editor.js
          grep -q 'Math.min(3,current+1)' chemistry-editor.js
          grep -q 'showEditorWindow' chemistry-editor.js
      - name: Commit tested upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chemistry-editor.js chemistry-editor.css
          git commit -m 'Upgrade molecular drawing chemistry and live 3D preview'
          git push origin HEAD:chemistry-upgrade-20261009
