          # Insert smart 2D tidy and lightweight interactive 3D preview before component helpers.
          anchor='''  function componentCentroid(ids){
'''
          enhancement=r'''  function tidy2DGeometry(){
    if(graph.atoms.length<2)return;
    const movable=graph.atoms;
    for(let iter=0;iter<70;iter++){
      graph.bonds.forEach(b=>{
        const a=atomById(b.a),c=atomById(b.b);if(!a||!c)return;
        const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||1,target=Number(b.order||1)===1?68:Number(b.order||1)===2?64:60;
        const pull=(d-target)*0.12,ux=dx/d,uy=dy/d;a.x+=ux*pull*.5;a.y+=uy*pull*.5;c.x-=ux*pull*.5;c.y-=uy*pull*.5;
      });
      for(let i=0;i<movable.length;i++)for(let j=i+1;j<movable.length;j++){
        if(bondBetween(movable[i].id,movable[j].id))continue;
        const a=movable[i],b=movable[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
        if(d<48){const push=(48-d)*0.025,ux=dx/d,uy=dy/d;a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;}
      }
    }
    ensureCanvasContainsDrawing();
  }

  const ELEMENT_3D_COLORS={H:'#f4f4f4',C:'#8b9198',N:'#3050f8',O:'#ff3030',P:'#ff8c1a',S:'#ffd92f',F:'#66ff66',Cl:'#39d353',Br:'#a62929',I:'#8a4fb5'};
  function graphSignature3D(){return JSON.stringify({atoms:graph.atoms.map(a=>[a.id,a.element,Math.round(a.x*10),Math.round(a.y*10)]),bonds:graph.bonds.map(b=>[b.a,b.b,b.order])});}
  function adjacency(){const m=new Map(graph.atoms.map(a=>[a.id,[]]));graph.bonds.forEach(b=>{m.get(b.a)?.push({id:b.b,order:Number(b.order||1)});m.get(b.b)?.push({id:b.a,order:Number(b.order||1)});});return m;}
  function findSixMemberRings(adj){
    const rings=[],seen=new Set();
    const walk=(start,current,path)=>{
      if(path.length===6){if((adj.get(current)||[]).some(n=>n.id===start)){const key=[...path].sort().join('|');if(!seen.has(key)){seen.add(key);rings.push([...path]);}}return;}
      (adj.get(current)||[]).forEach(n=>{if(n.id!==start&&!path.includes(n.id))walk(start,n.id,[...path,n.id]);});
    };
