  }
  function buildIdealized3D(){
    if(!graph.atoms.length)return [];
    const avgBond=graph.bonds.length?graph.bonds.reduce((s,b)=>{const a=atomById(b.a),c=atomById(b.b);return s+(a&&c?Math.hypot(c.x-a.x,c.y-a.y):0);},0)/graph.bonds.length:68;
    const scale=1.45/Math.max(20,avgBond||68),cx=graph.atoms.reduce((s,a)=>s+a.x,0)/graph.atoms.length,cy=graph.atoms.reduce((s,a)=>s+a.y,0)/graph.atoms.length;
    const coords=new Map(graph.atoms.map(a=>[a.id,{id:a.id,element:a.element,x:(a.x-cx)*scale,y:-(a.y-cy)*scale,z:0}]));
    const adj=adjacency(),rings=findSixMemberRings(adj),ringAtoms=new Set();
    rings.forEach(ids=>{
      const pts=ids.map(id=>coords.get(id)).filter(Boolean);if(pts.length!==6)return;
      const mx=pts.reduce((s,p)=>s+p.x,0)/6,my=pts.reduce((s,p)=>s+p.y,0)/6,r=1.40,first=pts[0],phase=Math.atan2(first.y-my,first.x-mx);
      ids.forEach((id,i)=>{const p=coords.get(id);if(p){p.x=mx+Math.cos(phase+i*Math.PI/3)*r;p.y=my+Math.sin(phase+i*Math.PI/3)*r;p.z=0;ringAtoms.add(id);}});
    });
    graph.atoms.forEach((a,idx)=>{
      const neighbors=adj.get(a.id)||[];if(ringAtoms.has(a.id))return;
      if(neighbors.length>=4){const p=coords.get(a.id);p.z=(idx%2?0.25:-0.25);neighbors.forEach((n,j)=>{const q=coords.get(n.id);if(q&&!ringAtoms.has(n.id))q.z+=(j%2?0.55:-0.55);});}
    });
    const arr=[...coords.values()],byId=new Map(arr.map(p=>[p.id,p]));
    for(let iter=0;iter<90;iter++){
      graph.bonds.forEach(b=>{const a=byId.get(b.a),c=byId.get(b.b);if(!a||!c)return;const dx=c.x-a.x,dy=c.y-a.y,dz=c.z-a.z,d=Math.hypot(dx,dy,dz)||1,target=Number(b.order||1)===1?1.50:Number(b.order||1)===2?1.34:1.20,pull=(d-target)*0.08,ux=dx/d,uy=dy/d,uz=dz/d,fa=ringAtoms.has(a.id)?0:.5,fc=ringAtoms.has(c.id)?0:.5;a.x+=ux*pull*fa;a.y+=uy*pull*fa;a.z+=uz*pull*fa;c.x-=ux*pull*fc;c.y-=uy*pull*fc;c.z-=uz*pull*fc;});
      for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const a=arr[i],b=arr[j];if(bondBetween(a.id,b.id))continue;const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.hypot(dx,dy,dz)||.01;if(d<1.15){const push=(1.15-d)*.012,ux=dx/d,uy=dy/d,uz=dz/d;if(!ringAtoms.has(a.id)){a.x-=ux*push;a.y-=uy*push;a.z-=uz*push;}if(!ringAtoms.has(b.id)){b.x+=ux*push;b.y+=uy*push;b.z+=uz*push;}}}
    }
    return arr;
  }
  function rotate3DPoint(p){
    const cy=Math.cos(threeDView.ry),sy=Math.sin(threeDView.ry),cx=Math.cos(threeDView.rx),sx=Math.sin(threeDView.rx),x1=p.x*cy+p.z*sy,z1=-p.x*sy+p.z*cy,y1=p.y*cx-z1*sx,z2=p.y*sx+z1*cx;return {...p,x:x1,y:y1,z:z2};
