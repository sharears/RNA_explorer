          '''  const bondBetween=(a,b)=>graph.bonds.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));

  function atomValenceSum(id){
    return graph.bonds.reduce((sum,b)=>sum+((b.a===id||b.b===id)?Number(b.order||1):0),0);
