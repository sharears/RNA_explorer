name: Add secondary undo redo and timing update

on:
  push:
    paths:
      - '.github/workflows/add-secondary-undo-redo-timing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('secondary-selection-tools.js')
          s=p.read_text()
          old='''const SecondarySelectionTools=(()=>{\n  let mode="",gesture=null,overlay=null;\n  const $=id=>document.getElementById(id);'''
          new='''const SecondarySelectionTools=(()=>{\n  let mode="",gesture=null,overlay=null;\n  let undoStack=[],redoStack=[],continuousEdit=false,restoringHistory=false;\n  const $=id=>document.getElementById(id);\n  function snapshot(){try{return JSON.stringify(SecondaryExplorer?.getWorkspaceSnapshot?.()||null);}catch(_){return null;}}\n  function syncHistoryButtons(){const u=$("seUndo"),r=$("seRedo");if(u)u.disabled=undoStack.length===0;if(r)r.disabled=redoStack.length===0;}\n  function remember(){if(restoringHistory)return;const snap=snapshot();if(!snap)return;if(undoStack.at(-1)!==snap)undoStack.push(snap);if(undoStack.length>80)undoStack.shift();redoStack=[];syncHistoryButtons();}\n  function restoreHistory(raw){if(!raw)return;restoringHistory=true;try{SecondaryExplorer.restoreWorkspaceSnapshot(JSON.parse(raw));syncTransformControls();syncSelectionState();}finally{restoringHistory=false;}syncHistoryButtons();}\n  function undo(){if(!undoStack.length)return;const current=snapshot();const previous=undoStack.pop();if(current)redoStack.push(current);restoreHistory(previous);}\n  function redo(){if(!redoStack.length)return;const current=snapshot();const next=redoStack.pop();if(current)undoStack.push(current);restoreHistory(next);}\n  function beginContinuousEdit(){if(!continuousEdit){remember();continuousEdit=true;}}\n  function endContinuousEdit(){continuousEdit=false;}'''
          if old not in s: raise SystemExit('secondary header anchor missing')
          s=s.replace(old,new,1)

          old='''    gesture=null;removeOverlay();SecondaryExplorer.highlightResidues(indices);resetSelectedTransform();syncSelectionState();'''
          new='''    gesture=null;removeOverlay();remember();SecondaryExplorer.highlightResidues(indices);resetSelectedTransform();syncSelectionState();'''
          if old not in s: raise SystemExit('finish anchor missing')
          s=s.replace(old,new,1)

          old='''    bar.innerHTML=`<div class="se-transform-group" role="group" aria-label="Secondary structure selection tools">\n      <strong>Select region</strong>'''
          new='''    bar.innerHTML=`<div class="se-history-group" role="group" aria-label="Undo and redo secondary structure changes">\n      <button id="seUndo" type="button" disabled title="Undo (Ctrl+Z / ⌘Z)">Undo</button>\n      <button id="seRedo" type="button" disabled title="Redo (Ctrl+Y / Ctrl+Shift+Z / ⌘Shift+Z)">Redo</button>\n    </div>\n    <div class="se-transform-group" role="group" aria-label="Secondary structure selection tools">\n      <strong>Select region</strong>'''
          if old not in s: raise SystemExit('toolbar anchor missing')
          s=s.replace(old,new,1)

          old='''    $("seBoxSelectTool").addEventListener("click",()=>setMode("box"));$("seLassoSelectTool").addEventListener("click",()=>setMode("lasso"));\n    $("seClearRegionSelection").addEventListener("click",()=>{SecondaryExplorer.clearHighlights();resetSelectedTransform();syncSelectionState();});\n    $("seWholeRotation").addEventListener("input",e=>{const value=Number(e.target.value);$("seWholeRotationValue").textContent=value+"°";SecondaryExplorer.setWholeRotation(value);});\n    $("seSelectedRotation").addEventListener("input",e=>{const value=Number(e.target.value),scale=Number($("seSelectedScale").value);$("seSelectedRotationValue").textContent=value+"°";SecondaryExplorer.setSelectionTransform({rotation:value,scale});});\n    $("seSelectedScale").addEventListener("input",e=>{const scale=Number(e.target.value),rotation=Number($("seSelectedRotation").value);$("seSelectedScaleValue").textContent=Math.round(scale*100)+"%";SecondaryExplorer.setSelectionTransform({rotation,scale});});\n    $("seResetSelectedTransform").addEventListener("click",resetSelectedTransform);'''
          new='''    $("seUndo").addEventListener("click",undo);$("seRedo").addEventListener("click",redo);\n    $("seBoxSelectTool").addEventListener("click",()=>setMode("box"));$("seLassoSelectTool").addEventListener("click",()=>setMode("lasso"));\n    $("seClearRegionSelection").addEventListener("click",()=>{remember();SecondaryExplorer.clearHighlights();resetSelectedTransform();syncSelectionState();});\n    ["seWholeRotation","seSelectedRotation","seSelectedScale"].forEach(id=>{const el=$(id);el.addEventListener("pointerdown",beginContinuousEdit);el.addEventListener("keydown",event=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End","PageUp","PageDown"].includes(event.key))beginContinuousEdit();});el.addEventListener("pointerup",endContinuousEdit);el.addEventListener("change",endContinuousEdit);el.addEventListener("blur",endContinuousEdit);});\n    $("seWholeRotation").addEventListener("input",e=>{beginContinuousEdit();const value=Number(e.target.value);$("seWholeRotationValue").textContent=value+"°";SecondaryExplorer.setWholeRotation(value);});\n    $("seSelectedRotation").addEventListener("input",e=>{beginContinuousEdit();const value=Number(e.target.value),scale=Number($("seSelectedScale").value);$("seSelectedRotationValue").textContent=value+"°";SecondaryExplorer.setSelectionTransform({rotation:value,scale});});\n    $("seSelectedScale").addEventListener("input",e=>{beginContinuousEdit();const scale=Number(e.target.value),rotation=Number($("seSelectedRotation").value);$("seSelectedScaleValue").textContent=Math.round(scale*100)+"%";SecondaryExplorer.setSelectionTransform({rotation,scale});});\n    $("seResetSelectedTransform").addEventListener("click",()=>{remember();resetSelectedTransform();});'''
          if old not in s: raise SystemExit('listener anchor missing')
          s=s.replace(old,new,1)

          old='''    document.addEventListener("keydown",event=>{if(event.key==="Escape"){cancel();setMode("");}});'''
          new='''    document.addEventListener("keydown",event=>{\n      if(event.key==="Escape"){cancel();setMode("");return;}\n      const target=event.target,typing=target?.matches?.("input:not([type=range]),textarea,[contenteditable=true]");if(typing)return;\n      const mod=event.ctrlKey||event.metaKey;if(!mod)return;\n      if(event.key.toLowerCase()==="z"){event.preventDefault();event.shiftKey?redo():undo();}\n      else if(event.ctrlKey&&event.key.toLowerCase()==="y"){event.preventDefault();redo();}\n    });'''
          if old not in s: raise SystemExit('keyboard anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('secondary-selection-tools.css')
          s=p.read_text()
          old='.se-transform-range{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);white-space:nowrap}.se-transform-range input[type="range"]{width:118px}.se-transform-range output{min-width:42px;color:var(--cream);font:12px "DM Mono",monospace;text-align:right}'
          new='.se-transform-range{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);white-space:nowrap}.se-transform-range input[type="range"]{width:118px}.se-transform-range #seWholeRotation,.se-transform-range #seSelectedRotation{width:260px}.se-transform-range output{min-width:42px;color:var(--cream);font:12px "DM Mono",monospace;text-align:right}'
          if old not in s: raise SystemExit('range css anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('.se-transform-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}', '.se-history-group,.se-transform-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}',1)
          p.write_text(s)

          p=Path('learning-tools.js')
          s=p.read_text()
          if 'setInterval(nextFact,9000)' not in s: raise SystemExit('fact timer anchor missing')
          s=s.replace('setInterval(nextFact,9000)','setInterval(nextFact,120000)',1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('learning-tools.js?v=learning-tools-2','learning-tools.js?v=learning-tools-3',1)
          s=s.replace('secondary-selection-tools.js?v=1','secondary-selection-tools.js?v=2',1)
          s=s.replace('secondary-selection-tools.css?v=1','secondary-selection-tools.css?v=2',1)
          p.write_text(s)
          print('PATCH_OK')
          PY

      - name: Check syntax and timing
        run: |
          node --check secondary-selection-tools.js
          node --check learning-tools.js
          grep -q 'setInterval(nextFact,120000)' learning-tools.js
          grep -q 'id="seUndo"' secondary-selection-tools.js
          grep -q 'id="seRedo"' secondary-selection-tools.js
          grep -q '#seWholeRotation,.se-transform-range #seSelectedRotation{width:260px}' secondary-selection-tools.css

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build test copy
        run: |
          rm -rf dist
          mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/

      - name: Browser-test undo redo and rotation controls
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/rna-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          try{
            await page.goto('http://127.0.0.1:4173/?page=secondary',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#seWholeRotation');
            const widths=await page.evaluate(()=>({whole:document.querySelector('#seWholeRotation').getBoundingClientRect().width,selected:document.querySelector('#seSelectedRotation').getBoundingClientRect().width}));
            if(widths.whole<240||widths.selected<240)throw new Error('Rotation sliders are still too short: '+JSON.stringify(widths));
            await page.locator('#seWholeRotation').evaluate(el=>{el.value='60';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});
            let state=await page.evaluate(()=>SecondaryExplorer.getTransformState());
            if(Math.round(state.wholeRotation)!==60)throw new Error('Rotation input failed');
            await page.click('#seUndo');
            state=await page.evaluate(()=>SecondaryExplorer.getTransformState());
            if(Math.round(state.wholeRotation)!==0)throw new Error('Undo button failed: '+JSON.stringify(state));
            await page.click('#seRedo');
            state=await page.evaluate(()=>SecondaryExplorer.getTransformState());
            if(Math.round(state.wholeRotation)!==60)throw new Error('Redo button failed: '+JSON.stringify(state));
            await page.keyboard.press('Control+z');
            state=await page.evaluate(()=>SecondaryExplorer.getTransformState());
            if(Math.round(state.wholeRotation)!==0)throw new Error('Ctrl+Z failed');
            await page.keyboard.press('Control+y');
            state=await page.evaluate(()=>SecondaryExplorer.getTransformState());
            if(Math.round(state.wholeRotation)!==60)throw new Error('Ctrl+Y failed');
            console.log('PASS',JSON.stringify({widths,state}));
          } finally {await browser.close();}
          JS

      - name: Commit verified update and remove temporary workflow
        run: |
          rm .github/workflows/add-secondary-undo-redo-timing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-selection-tools.js secondary-selection-tools.css learning-tools.js index.html .github/workflows/add-secondary-undo-redo-timing.yml
          git commit -m 'Add secondary undo redo and calmer controls'
          git push
