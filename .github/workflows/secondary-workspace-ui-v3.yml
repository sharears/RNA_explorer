      - name: Validate JavaScript and expected UI source
        run: |
          node --check chemistry-editor.js
          node --check secondary.js
          node --check secondary-selection-tools.js
          grep -q 'summary>History' secondary-selection-tools.js
          grep -q 'Select · Residues & regions' secondary-selection-tools.js
          ! grep -q 'id="seUndoLayout"' secondary.js
          ! grep -q 'id="seRedoLayout"' secondary.js
          grep -q 'data.indexLabel' secondary.js
          grep -q 'chem-rotation-angle' chemistry-editor.js

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build test copy
        run: |
          rm -rf dist && mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/

      - name: Browser-test interactions
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/rna-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          try{
            await page.goto('http://127.0.0.1:4173/?page=secondary&start=example',{waitUntil:'networkidle'});
            await page.waitForSelector('#seTransformToolbar',{state:'visible'});
            const summaries=await page.locator('#seTransformToolbar summary').allTextContents();
            if(!summaries.includes('History')||!summaries.includes('Select · Residues & regions'))throw new Error('History/Select grouping mismatch: '+JSON.stringify(summaries));
            if(await page.locator('#seUndoLayout,#seRedoLayout').count())throw new Error('Old Undo move / Redo move controls still exist');
            const order=await page.evaluate(()=>{const v=document.querySelector('.secondary-viewport'),w=document.querySelector('#seWholeRotationBar');return Boolean(v&&w&&(v.compareDocumentPosition(w)&Node.DOCUMENT_POSITION_FOLLOWING));});
            if(!order)throw new Error('Whole-RNA rotation control is not below the structure viewport');
            await page.locator('#seWholeRotation').evaluate(el=>{el.value='35';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});
            const wholeState=await page.evaluate(()=>SecondaryExplorer.getTransformState());
            if(wholeState.wholeRotation!==35)throw new Error('Whole rotation failed');
            if((await page.locator('#seWholeRotationValue').textContent())!=='35°')throw new Error('Whole rotation angle is not shown');

            await page.evaluate(()=>{SecondaryExplorer.setWholeRotation(0);SecondaryExplorer.highlightResidues([0,1,2,3]);SecondaryExplorer.setSelectionTransform({rotation:0,scale:1});});
            await page.waitForSelector('[data-se-transform-handle="rotate"]',{state:'visible'});
            const rotate=await page.locator('[data-se-transform-handle="rotate"]').boundingBox();if(!rotate)throw new Error('Selected-region rotate handle missing');
            await page.mouse.move(rotate.x+rotate.width/2,rotate.y+rotate.height/2);await page.mouse.down();await page.mouse.move(rotate.x+rotate.width/2+45,rotate.y+rotate.height/2+25,{steps:8});
            const selectedAngle=(await page.locator('.se-selected-angle').textContent())||'';
            if(!selectedAngle.includes('°'))throw new Error('Selected-region live angle is not shown');
            const duringRotate=await page.evaluate(()=>SecondaryExplorer.getTransformState().selectionRotation);if(Math.abs(duringRotate)<1)throw new Error('Selected region did not rotate');
            await page.mouse.up();
            await page.click('#seUndo');
            const afterUndo=await page.evaluate(()=>SecondaryExplorer.getTransformState().selectionRotation);if(Math.abs(afterUndo)>1e-6)throw new Error('History Undo did not restore selected rotation');
            await page.click('#seRedo');
            const afterRedo=await page.evaluate(()=>SecondaryExplorer.getTransformState().selectionRotation);if(Math.abs(afterRedo)<1)throw new Error('History Redo did not restore selected rotation');

            // Drag a residue index independently and confirm RNA coordinates do not move.
            await page.evaluate(()=>{SecondaryExplorer.setSelectionTransform({rotation:0,scale:1});SecondaryExplorer.clearHighlights();});
            await page.waitForSelector('#secondarySvg .se-index',{state:'visible'});
            const beforePositions=await page.evaluate(()=>SecondaryExplorer.getCurrentPositions());
            const indexLocator=page.locator('#secondarySvg .se-index').first();const beforeIndex=await indexLocator.boundingBox();if(!beforeIndex)throw new Error('Residue index not measurable');
            await page.mouse.move(beforeIndex.x+beforeIndex.width/2,beforeIndex.y+beforeIndex.height/2);await page.mouse.down();await page.mouse.move(beforeIndex.x+beforeIndex.width/2+42,beforeIndex.y+beforeIndex.height/2+24,{steps:8});await page.mouse.up();await page.waitForTimeout(100);
            const afterPositions=await page.evaluate(()=>SecondaryExplorer.getCurrentPositions());
            const maxResidueShift=Math.max(...afterPositions.map((p,i)=>Math.hypot(p.x-beforePositions[i].x,p.y-beforePositions[i].y)));
            if(maxResidueShift>1e-6)throw new Error('Dragging a residue index moved the RNA structure: '+maxResidueShift);
            const afterIndex=await page.locator('#secondarySvg .se-index').first().boundingBox();if(!afterIndex||Math.hypot(afterIndex.x-beforeIndex.x,afterIndex.y-beforeIndex.y)<10)throw new Error('Residue index did not move independently');
            await page.click('#seUndo');await page.waitForTimeout(100);
            const undoIndex=await page.locator('#secondarySvg .se-index').first().boundingBox();if(!undoIndex||Math.hypot(undoIndex.x-beforeIndex.x,undoIndex.y-beforeIndex.y)>3)throw new Error('History Undo did not restore residue-index position');

            // A normal nucleotide move must also be undoable from the History block.
            const node=page.locator('#secondarySvg .se-node').nth(5);const nodeBox=await node.boundingBox();if(!nodeBox)throw new Error('Nucleotide not measurable');
            const residueBefore=await page.evaluate(()=>SecondaryExplorer.getCurrentPositions()[5]);
            await page.mouse.move(nodeBox.x+nodeBox.width/2,nodeBox.y+nodeBox.height/2);await page.mouse.down();await page.mouse.move(nodeBox.x+nodeBox.width/2+35,nodeBox.y+nodeBox.height/2+20,{steps:8});await page.mouse.up();await page.waitForTimeout(100);
            const residueMoved=await page.evaluate(()=>SecondaryExplorer.getCurrentPositions()[5]);if(Math.hypot(residueMoved.x-residueBefore.x,residueMoved.y-residueBefore.y)<5)throw new Error('Nucleotide drag did not move');
            await page.click('#seUndo');await page.waitForTimeout(100);
            const residueRestored=await page.evaluate(()=>SecondaryExplorer.getCurrentPositions()[5]);if(Math.hypot(residueRestored.x-residueBefore.x,residueRestored.y-residueBefore.y)>2)throw new Error('History Undo did not restore nucleotide move');

            // Molecular drawing rotate handle must show a live angle while dragging.
            await page.evaluate(()=>MoleculeEditor.openBase('A'));
            await page.waitForSelector('#chemEditorDialog[open]');
            const atoms=page.locator('#chemEditorSvg [data-atom-id]');
            await atoms.nth(0).click();await atoms.nth(1).click({modifiers:['Shift']});
            await page.waitForSelector('#chemEditorSvg [data-transform-handle="rotate"]',{state:'visible'});
            const chemRotate=await page.locator('#chemEditorSvg [data-transform-handle="rotate"]').boundingBox();if(!chemRotate)throw new Error('Molecular rotate handle missing');
            await page.mouse.move(chemRotate.x+chemRotate.width/2,chemRotate.y+chemRotate.height/2);await page.mouse.down();await page.mouse.move(chemRotate.x+chemRotate.width/2+38,chemRotate.y+chemRotate.height/2+24,{steps:8});
            const chemAngle=(await page.locator('#chemEditorSvg .chem-rotation-angle').textContent())||'';if(!chemAngle.includes('°'))throw new Error('Molecular drawing live rotation angle missing');
            await page.mouse.up();

            const serious=errors.filter(x=>!/favicon|ResizeObserver loop/i.test(x));if(serious.length)throw new Error('Browser errors: '+serious.join('\n'));
            console.log(JSON.stringify({result:'PASS',selectedAngle,chemAngle,maxResidueShift}));
          } finally {await browser.close();}
          JS

      - name: Commit verified update and remove workflow
        run: |
          rm .github/workflows/secondary-workspace-ui-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine secondary workspace selection and history'
          git push
