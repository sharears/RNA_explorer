          p=Path('secondary-selection-tools.css');s=p.read_text();s='''/* Secondary selection/history controls mirror the molecular drawing workspace. */\n.se-transform-toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;margin-bottom:9px}\n.se-tool-group{border:1px solid rgba(116,215,182,.24);border-radius:9px;background:rgba(255,255,255,.025);overflow:hidden}\n.se-tool-group>summary{cursor:pointer;padding:9px 11px;color:var(--cream);font-size:.82rem;font-weight:700;user-select:none}\n.se-tool-group-body{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 10px 10px}\n.se-tool-group-body button{border:1px solid var(--line);background:var(--ink-soft);color:var(--text);border-radius:7px;padding:8px 10px;cursor:pointer}\n.se-tool-group-body button.active,.se-tool-group-body button[aria-pressed="true"]{border-color:var(--mint);background:rgba(116,215,182,.12);color:var(--mint)}\n.se-tool-group-body button:disabled{opacity:.42;cursor:default}\n#seSelectionStatus{flex:1 1 100%;margin:1px 0 0;color:var(--muted);font-size:.78rem;line-height:1.45;max-width:620px}\n.se-whole-rotation-bar{display:flex;justify-content:center;padding:11px 12px;margin:8px 0 2px;border:1px solid rgba(116,215,182,.18);border-radius:9px;background:rgba(116,215,182,.025)}\n.se-whole-rotation-bar label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}\n.se-whole-rotation-bar input[type="range"]{width:min(520px,55vw)}\n.se-whole-rotation-bar output{min-width:48px;color:var(--cream);font:13px "DM Mono",monospace;text-align:right}\n#secondarySvg.se-selecting{cursor:crosshair;touch-action:none}\n.se-selection-overlay{stroke:#74d7b6;stroke-width:2;stroke-dasharray:7 5;fill:rgba(116,215,182,.10);vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px rgba(116,215,182,.35))}\n.se-transform-box{fill:rgba(242,198,109,.025);stroke:#f2c66d;stroke-width:1.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}\n.se-transform-stem{stroke:#f2c66d;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}\n.se-transform-handle{fill:#07111c;stroke:#f2c66d;stroke-width:2;vector-effect:non-scaling-stroke;cursor:nwse-resize}\n.se-rotate-handle{fill:#f2c66d;stroke:#07111c;cursor:grab}\n.se-selection-count,.se-selected-angle{fill:#f2c66d;font:700 12px "DM Mono",monospace;paint-order:stroke;stroke:#07111c;stroke-width:4px;pointer-events:none}\n.se-selected-angle{font-size:13px}\n.se-index{cursor:move;pointer-events:auto;user-select:none}\n\n/* Homepage Did-you-know strip */\nbody:not([data-page-mode="home"]) .home-fact-strip{display:none!important}\n.home-fact-strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;margin:-34px 0 38px;padding:16px 20px;border:1px solid rgba(116,215,182,.34);border-radius:14px;background:linear-gradient(90deg,rgba(116,215,182,.11),rgba(232,187,105,.07));box-shadow:0 12px 30px rgba(0,0,0,.13)}\n.home-fact-label{font:800 .82rem "DM Mono",monospace;color:var(--mint);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}.home-fact-strip p{margin:0;color:var(--cream);font-size:1rem;line-height:1.55}.home-fact-strip button{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:var(--text);padding:8px 11px;cursor:pointer;white-space:nowrap}.home-fact-strip button:hover{border-color:var(--mint);color:var(--mint)}\n\n/* Four-level flashcard picker */\n.flashcard-level-wrap{display:grid;gap:10px;margin:0 0 18px}.flashcard-level-heading{display:flex;justify-content:space-between;gap:16px;align-items:baseline}.flashcard-level-heading strong{font-size:1rem}.flashcard-level-heading span{color:var(--muted);font-size:.85rem;text-align:right}.flashcard-levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.flashcard-levels button{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);color:var(--text);padding:11px 8px;cursor:pointer;font-weight:750}.flashcard-levels button.active,.flashcard-levels button:hover{border-color:var(--mint);background:rgba(116,215,182,.1);color:var(--mint)}\n\n@media(max-width:720px){\n  .se-transform-toolbar{align-items:stretch}.se-tool-group{flex:1 1 100%}.se-whole-rotation-bar label{width:100%;display:grid;grid-template-columns:auto 1fr auto}.se-whole-rotation-bar input[type="range"]{width:100%}\n  .home-fact-strip{grid-template-columns:1fr;gap:8px;margin-top:-24px}.home-fact-strip button{justify-self:start}\n  .flashcard-levels{grid-template-columns:repeat(2,minmax(0,1fr))}.flashcard-level-heading{display:grid;gap:4px}.flashcard-level-heading span{text-align:left}.rna-flashcard{min-height:230px;padding:24px 18px}.rna-flashcard strong{font-size:clamp(1.2rem,6vw,1.65rem)}\n}\n''';p.write_text(s)

