name: Unified workspace menus browser test

on:
  push:
    branches:
      - fix/unify-secondary-tertiary-tabs-2026-10-18
    paths:
      - workspace-organizer.js
      - workspace-tools.js
      - ui-fixes.js
      - index.html
      - tests/unified-workspace-tabs-browser.mjs
      - .github/workflows/unified-workspace-tabs-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve isolated working copy
        run: |
          python3 -m http.server 4173 >/tmp/rna-menus-http.log 2>&1 &
          echo $! > /tmp/rna-menus-http.pid
          sleep 2
      - name: Verify unified controls and original features
        run: node tests/unified-workspace-tabs-browser.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-workspace-tabs-test
          path: test-output/unified-workspace-tabs/
          if-no-files-found: warn
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/rna-menus-http.pid ]; then kill "$(cat /tmp/rna-menus-http.pid)" || true; fi
