name: Apply RNA Explorer homepage polish v2

on:
  push:
    paths:
      - '.github/apply_home_polish_v2.py'
      - '.github/workflows/apply-home-polish-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply polish
        run: python .github/apply_home_polish_v2.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check secondary.js
          node --check tertiary.js
      - name: Focused UI checks
        run: |
          grep -Fq 'styles.css?v=modern-ui-2' index.html
          grep -Fq 'site-search-button::before{content:none!important' styles.css
          grep -Fq 'utility-menu:hover>.utility-menu-panel' styles.css
          grep -Fq -- '--violet:#9383ff' styles.css
          grep -Fq 'mask-image:radial-gradient' styles.css
          grep -Fq 'home-cover-kicker' styles.css
          grep -Fq 'home-cover-note' styles.css
      - name: Remove temporary updater
        run: rm .github/apply_home_polish_v2.py .github/workflows/apply-home-polish-v2.yml
      - name: Commit finished polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Polish RNA Explorer homepage and navigation'
            git push
          fi
