name: Refine selection boxes v2

on:
  push:
    paths:
      - '.github/workflows/refine-selection-boxes-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reuse staged patch from first workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/refine-selection-boxes.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
            lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_selection_patch.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/apply_selection_patch.py
          node --check secondary-selection-tools.js
          node --check chemistry-editor.js

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser test selection boxes
        run: |
          rm -rf dist && mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/
          python3 -m http.server 4173 --directory dist >/tmp/rna-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const dragOutward=async(handleLocator,boxLocator,distance=70)=>{
            const hb=await handleLocator.boundingBox(),bb=await boxLocator.boundingBox();
            if(!hb||!bb)throw new Error('Transform handle or box is outside the visible canvas');
            const hx=hb.x+hb.width/2,hy=hb.y+hb.height/2,cx=bb.x+bb.width/2,cy=bb.y+bb.height/2;
            const dx=hx-cx,dy=hy-cy,len=Math.hypot(dx,dy)||1;
            await page.mouse.move(hx,hy);await page.mouse.down();await page.mouse.move(hx+dx/len*distance,hy+dy/len*distance,{steps:8});
          };
          try{
            await page.goto('http://127.0.0.1:4173/?page=secondary&start=example',{waitUntil:'networkidle'});
            await page.waitForSelector('#seTransformToolbar',{state:'visible'});
            await page.click('#seBoxSelectTool');
            const indices=await page.evaluate(()=>{
              const svg=document.getElementById('secondarySvg'),sr=svg.getBoundingClientRect();
              const nodes=[...svg.querySelectorAll('.se-node')].map((node,index)=>{const r=node.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,margin=Math.min(x-sr.left,sr.right-x,y-sr.top,sr.bottom-y);return{index,x,y,margin};}).filter(n=>n.margin>70);
              nodes.sort((a,b)=>b.margin-a.margin);const anchor=nodes[0];if(!anchor)return [30,31,32,33];
              return nodes.sort((a,b)=>Math.hypot(a.x-anchor.x,a.y-anchor.y)-Math.hypot(b.x-anchor.x,b.y-anchor.y)).slice(0,4).map(n=>n.index);
            });
            await page.evaluate(ids=>{SecondaryExplorer.highlightResidues(ids);window.dispatchEvent(new Event('rna-secondary-select'));},indices);
            await page.waitForSelector('.se-selected-transform-overlay',{state:'visible'});
            if(await page.locator('#seBoxSelectTool').getAttribute('aria-pressed')!=='true')throw new Error('Secondary selection tool should remain active after selection');
            if(await page.locator('.se-scale-handle').count()!==4)throw new Error('Expected four secondary scale handles');
            if((await page.locator('.se-transform-zoom-label').textContent())?.trim()!=='100%')throw new Error('Secondary selection box is missing 100% zoom label');
            await dragOutward(page.locator('.se-scale-handle-se'),page.locator('.se-selected-transform-box'));
            const duringScale=await page.evaluate(()=>SecondaryExplorer.getTransformState().selectionScale);
            const duringLabel=(await page.locator('.se-transform-zoom-label').textContent())?.trim();
            if(Math.abs(duringScale-1)<.01)throw new Error('Secondary scale handle did not change selection scale');
            if(!duringLabel||duringLabel==='100%')throw new Error('Secondary zoom label did not update during scaling');
            await page.mouse.up();
            const afterLabel=(await page.locator('.se-transform-zoom-label').textContent())?.trim();
            if(afterLabel==='100%')throw new Error('Secondary zoom label did not persist after scaling');

            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.evaluate(()=>MoleculeEditor.openBase('A'));
            await page.waitForSelector('#chemEditorDialog[open]',{state:'visible'});
            await page.click('#chemSelectAll');
            await page.waitForSelector('.chem-transform-overlay',{state:'visible'});
            if((await page.locator('.chem-transform-zoom').textContent())?.trim()!=='100%')throw new Error('Molecular selection box is missing 100% zoom label');
            await dragOutward(page.locator('[data-transform-handle="se"]'),page.locator('.chem-transform-overlay rect'));
            const chemDuring=(await page.locator('.chem-transform-zoom').textContent())?.trim();
            if(!chemDuring||chemDuring==='100%')throw new Error('Molecular zoom label did not update during scaling');
            await page.mouse.up();
            const chemAfter=(await page.locator('.chem-transform-zoom').textContent())?.trim();
            if(!chemAfter||chemAfter==='100%')throw new Error('Molecular zoom label did not persist after scaling');

            const serious=errors.filter(x=>!/favicon|ResizeObserver loop/i.test(x));if(serious.length)throw new Error('Browser errors:\n'+serious.join('\n'));
            console.log(JSON.stringify({result:'PASS',secondaryIndices:indices,secondaryScale:duringScale,secondaryZoom:afterLabel,molecularZoom:chemAfter}));
          } finally {await browser.close();}
          JS

      - name: Commit verified update and remove temporary workflows
        run: |
          rm .github/workflows/refine-selection-boxes.yml .github/workflows/refine-selection-boxes-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-selection-tools.js secondary-selection-tools.css chemistry-editor.js chemistry-editor.css index.html .github/workflows/refine-selection-boxes.yml .github/workflows/refine-selection-boxes-v2.yml
          git commit -m 'Match secondary selection box behavior and show zoom percent'
          git push
