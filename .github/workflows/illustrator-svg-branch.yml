name: Illustrator SVG export branch test

on:
  push:
    branches:
      - fix/illustrator-svg-export-2026-10-17
    paths:
      - tertiary.js
      - tests/illustrator-svg-browser.mjs
      - .github/workflows/illustrator-svg-branch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-svg-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve isolated branch locally
        run: |
          python3 -m http.server 4173 >/tmp/rna-svg-http.log 2>&1 &
          echo $! >/tmp/rna-svg-http.pid
          sleep 2
      - name: Export an actual 3D SVG and inspect embedded PNG
        run: node tests/illustrator-svg-browser.mjs
      - name: Upload actual SVG and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-rna-3d-svg-illustrator-test
          path: test-output/illustrator-svg/
          if-no-files-found: warn
      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/rna-svg-http.pid ]; then kill "$(cat /tmp/rna-svg-http.pid)" || true; fi
