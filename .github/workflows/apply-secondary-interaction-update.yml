name: Apply secondary interaction update

on:
  push:
    paths:
      - '.github/workflows/apply-secondary-interaction-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/scripts/apply-secondary-interaction-update.py
      - name: Validate source
        run: |
          node --check chemistry-editor.js
          node --check secondary.js
          node --check secondary-selection-tools.js
          grep -q 'chem-rotation-angle' chemistry-editor.js
          grep -q 'data-index-label' secondary.js
          ! grep -q 'id="seUndoLayout"' secondary.js
          ! grep -q 'id="seRedoLayout"' secondary.js
          grep -q 'Rotate whole structure' secondary-selection-tools.js
          grep -q 'Select · Residues & regions' secondary-selection-tools.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build browser test copy
        run: |
          rm -rf dist
          mkdir dist
          cp index.html *.js *.css dist/
          cp -r data assets dist/
      - name: Browser interaction test
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/rna-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node .github/scripts/test-secondary-interaction.mjs
      - name: Commit verified update
        run: |
          rm -f .github/workflows/rna-secondary-interaction-update.yml
          rm -f .github/workflows/apply-secondary-interaction-update.yml
          rm -f .github/scripts/apply-secondary-interaction-update.py
          rm -f .github/scripts/test-secondary-interaction.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align secondary selection controls with molecular drawing'
          git push
