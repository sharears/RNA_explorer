name: Molecular 3D controls and learning browser

on:
  push:
    branches: [molecular-3d-interaction-learning-20261011, main]
    paths:
      - chemistry-editor.js
      - chemistry-editor.css
      - tertiary.js
      - index.html
      - tests/molecular-3d-controls-learning-style.mjs
      - .github/workflows/molecular-3d-controls-learning-browser.yml
  pull_request:
    paths:
      - chemistry-editor.js
      - chemistry-editor.css
      - tertiary.js
      - index.html
      - tests/molecular-3d-controls-learning-style.mjs
      - .github/workflows/molecular-3d-controls-learning-browser.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          node --check chemistry-editor.js
          node --check tertiary.js
      - name: Serve RNA Explorer
        run: |
          python3 -m http.server 4173 >/tmp/rna-http.log 2>&1 &
          echo $! >/tmp/rna-http.pid
          sleep 2
      - name: Test 3D controls and Learning-mode defaults
        run: node tests/molecular-3d-controls-learning-style.mjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-3d-controls-learning-diagnostics
          path: |
            /tmp/molecular-3d-controls-learning.png
            /tmp/rna-http.log
          if-no-files-found: ignore
