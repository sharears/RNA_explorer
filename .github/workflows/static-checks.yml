name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save linkedom playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p dist && cp index.html *.js *.css dist/ && cp -r data dist/data && cp -r assets dist/assets
      - run: node tests/tertiary.cjs
      - run: node tests/chemistry-editor.cjs
      - run: node tests/chemistry.cjs
      - run: node tests/security.cjs
      - run: node tests/secondary-v7.cjs
      - name: Serve RNA Explorer for browser checks
        run: |
          nohup python3 -m http.server 4173 --directory dist > /tmp/rna-explorer-http.log 2>&1 &
          echo $! > /tmp/rna-explorer-http.pid
          sleep 2
      - name: Browser smoke · homepage
        run: node tests/homepage-browser.mjs
      - name: Browser smoke · secondary workspace
        run: node tests/secondary-browser.mjs
      - name: Browser smoke · tertiary workspace
        run: node tests/tertiary-browser.mjs
      - name: Browser smoke · tertiary learning
        run: node tests/tertiary-learning-browser.mjs
      - name: Browser smoke · guided transitions
        run: node tests/guided-structure-transitions-browser.mjs
      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/rna-explorer-http.pid ]; then kill "$(cat /tmp/rna-explorer-http.pid)" || true; fi
