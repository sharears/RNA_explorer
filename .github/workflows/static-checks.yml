name: Static checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save linkedom playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p dist && cp index.html *.js *.css dist/ && cp -r data dist/data && cp -r assets dist/assets
      - run: node tests/tertiary.cjs
      - run: node tests/chemistry-editor.cjs
      - run: node tests/chemistry.cjs
      - run: node tests/secondary-v7.cjs
      - name: Browser smoke test · tertiary workspace
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/rna-explorer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/homepage-browser.mjs
          node tests/secondary-browser.mjs
          node tests/tertiary-browser.mjs
