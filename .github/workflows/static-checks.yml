name: Static checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save linkedom
      - run: node tests/tertiary.cjs
      - run: node tests/chemistry.cjs
      - run: node tests/secondary-v7.cjs
