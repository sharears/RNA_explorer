name: Apply workspace organizer

on:
  push:
    branches: [main]
    paths:
      - workspace-organizer.js

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add workspace organizer script to app
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='index.html';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes('workspace-organizer.js')){
            const needle='  <script src="ui-fixes.js?v=ui-fixes-4"></script>';
            if(!s.includes(needle)) throw new Error('Could not find script insertion point');
            s=s.replace(needle,'  <script src="workspace-organizer.js?v=1"></script>\n'+needle);
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load workspace organizer"
          git push
