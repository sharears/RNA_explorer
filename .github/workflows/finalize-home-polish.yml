name: Finalize home artwork polish

on:
  push:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Apply requested homepage polish and strengthen browser picking test
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          css = Path('styles.css')
          text = css.read_text()
          old_img = '.home-cover-art img{\n  display:block;width:100%;height:100%;min-height:560px;object-fit:cover;object-position:center 46%;\n}'
          new_img = '''.home-cover-art img{
  display:block;width:100%;height:100%;min-height:560px;object-fit:cover;object-position:center 46%;
  image-rendering:auto;
  -webkit-mask-image:radial-gradient(ellipse 94% 92% at 50% 48%,#000 0%,#000 60%,rgba(0,0,0,.96) 70%,rgba(0,0,0,.68) 82%,rgba(0,0,0,.28) 91%,transparent 100%);
  mask-image:radial-gradient(ellipse 94% 92% at 50% 48%,#000 0%,#000 60%,rgba(0,0,0,.96) 70%,rgba(0,0,0,.68) 82%,rgba(0,0,0,.28) 91%,transparent 100%);
}'''
          if old_img not in text:
              raise SystemExit('Expected home-cover image rule not found')
          text = text.replace(old_img, new_img, 1)
          old_font = 'font:600 clamp(.76rem,1.1vw,.98rem)/1.45 "Comic Sans MS","Comic Sans",cursive;\n  font-style:normal;'
          new_font = 'font:600 clamp(.76rem,1.1vw,.98rem)/1.45 "Comic Neue","Comic Sans MS","Comic Sans",cursive;\n  font-style:normal!important;'
          if old_font not in text:
              raise SystemExit('Expected thought-bubble font rule not found')
          text = text.replace(old_font, new_font, 1)
          text = text.replace('  transform:rotate(-2deg);', '  transform:none;', 1)
          css.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          old_fonts = 'family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap'
          new_fonts = 'family=Comic+Neue:wght@400;700&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap'
          if old_fonts not in html:
              raise SystemExit('Expected Google Fonts URL not found')
          html = html.replace(old_fonts, new_fonts, 1)
          html = html.replace('styles.css?v=modern-ui-2', 'styles.css?v=modern-ui-3', 1)
          index.write_text(html)

          image_path = Path('assets/rna-home-cover.webp')
          with Image.open(image_path) as im:
              im = im.convert('RGB')
              w, h = im.size
              print(f'Original home cover: {w}x{h}')
              if w < 1600:
                  scale = 4
                  enlarged = im.resize((w*scale, h*scale), Image.Resampling.LANCZOS)
                  enlarged = enlarged.filter(ImageFilter.UnsharpMask(radius=1.35, percent=115, threshold=3))
                  enlarged.save(image_path, 'WEBP', quality=95, method=6)
                  print(f'Upscaled home cover: {w*scale}x{h*scale}')
              else:
                  print('Cover is already high resolution; no additional upscale applied.')

          test = Path('tests/learning-advanced-stress-browser.mjs')
          t = test.read_text()
          needle = 'await page.selectOption("#teMeasureMode","distance");\n  await page.waitForFunction(()=>TertiaryExplorer.getDiagnostics().measurementMode==="distance");'
          replacement = '''await page.selectOption("#teRepresentation","spheres");
  await page.waitForFunction(()=>TertiaryExplorer.getDiagnostics().representation==="spheres");
  await page.click("#teFitAll");
  await page.click("#teZoomIn");
  await page.waitForTimeout(450);
  await page.selectOption("#teMeasureMode","distance");
  await page.waitForFunction(()=>TertiaryExplorer.getDiagnostics().measurementMode==="distance");'''
          if needle not in t:
              raise SystemExit('Expected distance-test setup not found')
          t = t.replace(needle, replacement, 1)
          t = t.replace('const fractions=[.22,.32,.42,.5,.58,.68,.78];', 'const fractions=[.12,.18,.24,.30,.36,.42,.48,.54,.60,.66,.72,.78,.84,.90];', 1)
          test.write_text(t)

          # One-shot workflow: remove itself from the resulting commit.
          Path('.github/workflows/finalize-home-polish.yml').unlink()
          PY
      - name: Verify image and JavaScript syntax
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/rna-home-cover.webp')
          print('Final image dimensions:', im.size)
          assert im.width >= 1600 and im.height >= 1700
          PY
          node --check ui-fixes.js
          node --check tests/learning-advanced-stress-browser.mjs
      - name: Commit requested updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html assets/rna-home-cover.webp tests/learning-advanced-stress-browser.mjs .github/workflows/finalize-home-polish.yml
          git commit -m "Polish home artwork and strengthen 3D browser validation"
          git push
