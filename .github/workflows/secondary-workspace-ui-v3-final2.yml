name: Finalize secondary workspace interaction update

on:
  push:
    paths:
      - '.github/workflows/secondary-workspace-ui-v3-final2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply, fix interaction details, and browser-test
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml, re

          workflow=yaml.safe_load(Path('.github/workflows/secondary-workspace-ui-v3-retry.yml').read_text())
          steps=workflow['jobs']['apply-test-commit']['steps']
          scripts={step.get('name'):step.get('run') for step in steps if step.get('run')}

          subprocess.run(['bash','-lc',scripts['Apply corrected update']],check=True)
          p=Path('secondary-selection-tools.js')
          s=p.read_text().replace('.secondary-viewport','.se-viewport')

          old='''    if(transformDrag?.kind==="rotate"){\n      const angle=document.createElementNS(svgNS,"text");angle.setAttribute("x",cx+14);angle.setAttribute("y",y-35);angle.setAttribute("class","se-selected-angle");angle.textContent=Math.round(SecondaryExplorer.getTransformState().selectionRotation)+"°";layer.append(angle);\n    }'''
          new='''    if(geom.chosen.length>=2){\n      const angle=document.createElementNS(svgNS,"text");angle.setAttribute("x",cx+14);angle.setAttribute("y",y-35);angle.setAttribute("class","se-selected-angle");angle.textContent=Math.round(SecondaryExplorer.getTransformState().selectionRotation)+"°";layer.append(angle);\n    }'''
          if old not in s: raise SystemExit('selected-angle block missing')
          s=s.replace(old,new,1)

          pattern=r'''  function beginSelectionTransform\(event,handle\)\{.*?\n  \}\n  function moveSelectionTransform\(event\)\{.*?\n  \}'''
          replacement='''  function beginSelectionTransform(event,handle){\n    const geom=selectionGeometry(),root=$("secondarySvg");if(!geom||!root)return false;remember();\n    let centerScreen={x:event.clientX,y:event.clientY};const ctm=root.getScreenCTM?.();\n    if(ctm&&typeof DOMPoint!=="undefined"){try{const c=new DOMPoint(geom.center.x,geom.center.y).matrixTransform(ctm);centerScreen={x:c.x,y:c.y};}catch(_){}}\n    const state=SecondaryExplorer.getTransformState(),dx=event.clientX-centerScreen.x,dy=event.clientY-centerScreen.y;\n    transformDrag={pointer:event.pointerId,kind:handle,startAngle:Math.atan2(dy,dx),startRadius:Math.max(8,Math.hypot(dx,dy)),startRotation:state.selectionRotation,startScale:state.selectionScale,centerScreen};\n    root.setPointerCapture?.(event.pointerId);event.preventDefault();event.stopImmediatePropagation();return true;\n  }\n  function moveSelectionTransform(event){\n    const t=transformDrag,dx=event.clientX-t.centerScreen.x,dy=event.clientY-t.centerScreen.y;\n    if(t.kind==="rotate"){\n      const delta=(Math.atan2(dy,dx)-t.startAngle)*180/Math.PI;\n      SecondaryExplorer.setSelectionTransform({rotation:normalizeAngle(t.startRotation+delta),scale:t.startScale});\n    }else{\n      const ratio=Math.hypot(dx,dy)/t.startRadius;\n      SecondaryExplorer.setSelectionTransform({rotation:t.startRotation,scale:Math.max(.35,Math.min(3,t.startScale*ratio))});\n    }\n    drawSelectionTransformOverlay();\n  }'''
          s,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if count!=1: raise SystemExit('selected transform functions not replaced')
          old='''    const handle=event.target.closest?.("[data-se-transform-handle]");if(handle&&beginSelectionTransform(event,handle.dataset.seTransformHandle))return;'''
          new='''    const handleKey=event.target?.dataset?.seTransformHandle||event.target?.closest?.("[data-se-transform-handle]")?.dataset?.seTransformHandle;if(handleKey&&beginSelectionTransform(event,handleKey))return;'''
          if old not in s: raise SystemExit('handle detection anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          validate=scripts['Validate JavaScript and source expectations'].replace("grep -q 'data.indexLabel' secondary.js","grep -q 'dataset.indexLabel' secondary.js")
          subprocess.run(['bash','-lc',validate],check=True)
          subprocess.run(['bash','-lc',scripts['Install browser test dependencies']],check=True)
          browser=scripts['Browser-test requested interactions'].replace("document.querySelector('.secondary-viewport')","document.querySelector('.se-viewport')")
          subprocess.run(['bash','-lc',browser],check=True)
          PY

      - name: Commit verified update and clean temporary workflows
        run: |
          rm -f .github/workflows/secondary-workspace-ui-v3.yml .github/workflows/secondary-workspace-ui-v3-retry.yml .github/workflows/secondary-workspace-ui-v3-final.yml .github/workflows/secondary-workspace-ui-v3-final2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine secondary workspace selection and history'
          git push

# retrigger with screen-space rotation and scaling for selected residues
