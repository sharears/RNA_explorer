name: Apply modern RNA Explorer UI cleanup

on:
  push:
    paths:
      - .github/workflows/apply-modern-ui-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply modern UI cleanup
        run: python3 .github/apply_modern_ui_cleanup.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check secondary.js
          node --check tertiary.js
      - name: Focused regression checks
        run: |
          npm install --no-save linkedom
          mkdir -p dist
          cp index.html *.js *.css dist/
          cp -r data dist/data
          cp -r assets dist/assets
          node tests/secondary-v7.cjs
          node tests/tertiary.cjs
          node tests/security.cjs
      - name: Verify modern UI hooks
        run: |
          grep -q 'utility-menu' index.html
          grep -q 'workspace-controls-toggle' index.html
          grep -q 'setupModernWorkspaceUi' app.js
          grep -q 'Modern UI cleanup v1' styles.css
          grep -q 'Modern secondary workspace v1' secondary.css
          grep -q 'Modern tertiary workspace v1' tertiary.css
          grep -q 'body\[data-page-mode="home"\] .intro{display:none' styles.css
      - name: Commit finished UI cleanup
        run: |
          rm -f .github/workflows/apply-modern-ui-cleanup.yml .github/apply_modern_ui_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css secondary.css tertiary.css .github/workflows/apply-modern-ui-cleanup.yml .github/apply_modern_ui_cleanup.py
          git commit -m "Simplify RNA Explorer navigation and workspaces"
          git push origin HEAD:main
