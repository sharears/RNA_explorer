name: Patch mini 3D free rotation

on:
  push:
    paths:
      - .github/workflows/patch-mini-3d-trackball.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch guided mini 3D interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('guided-transitions.js')
          s=p.read_text()

          old='''const GuidedStructureTransitions = (() => {\n  const state={secondaryReady:true,tertiaryReady:true,miniFeature:"glycosidic",yaw:-0.55,pitch:0.34,zoom:1,panX:0,panY:0,dragging:false,dragMode:"rotate",lastX:0,lastY:0,labelsOn:true,\n    realPairKey:"gc",realPairModels:null,realLessonModels:null,realPairPromise:null};'''
          new='''const GuidedStructureTransitions = (() => {\n  const state={secondaryReady:true,tertiaryReady:true,miniFeature:"glycosidic",yaw:-0.55,pitch:0.34,rotation:null,zoom:1,panX:0,panY:0,dragging:false,dragMode:"rotate",lastX:0,lastY:0,labelsOn:true,\n    realPairKey:"gc",realPairModels:null,realLessonModels:null,realPairPromise:null};'''
          if old not in s: raise SystemExit('state marker not found')
          s=s.replace(old,new,1)

          marker='''  function buildTertiaryTransition(){'''
          helpers='''  function miniQuatNormalize(q){\n    const n=Math.hypot(q[0],q[1],q[2],q[3])||1;return q.map(v=>v/n);\n  }\n  function miniQuatMultiply(a,b){\n    const [aw,ax,ay,az]=a,[bw,bx,by,bz]=b;\n    return [aw*bw-ax*bx-ay*by-az*bz,aw*bx+ax*bw+ay*bz-az*by,aw*by-ax*bz+ay*bw+az*bx,aw*bz+ax*by-ay*bx+az*bw];\n  }\n  function miniQuatAxisAngle(x,y,z,angle){\n    const n=Math.hypot(x,y,z)||1,h=angle/2,s=Math.sin(h)/n;return [Math.cos(h),x*s,y*s,z*s];\n  }\n  function miniQuatFromView(yaw,pitch){\n    return miniQuatNormalize(miniQuatMultiply(miniQuatAxisAngle(1,0,0,pitch),miniQuatAxisAngle(0,1,0,yaw)));\n  }\n  function miniRotateVector(p,q){\n    const [w,x,y,z]=miniQuatNormalize(q);\n    return {\n      x:(1-2*y*y-2*z*z)*p.x+2*(x*y-w*z)*p.y+2*(x*z+w*y)*p.z,\n      y:2*(x*y+w*z)*p.x+(1-2*x*x-2*z*z)*p.y+2*(y*z-w*x)*p.z,\n      z:2*(x*z-w*y)*p.x+2*(y*z+w*x)*p.y+(1-2*x*x-2*y*y)*p.z\n    };\n  }\n  function miniTrackballVector(svg,clientX,clientY){\n    const rect=svg.getBoundingClientRect(),radius=Math.max(1,Math.min(rect.width,rect.height)*.46);\n    let x=(clientX-(rect.left+rect.width/2))/radius,y=((rect.top+rect.height/2)-clientY)/radius;\n    const d=x*x+y*y;\n    if(d>=1){const scale=1/Math.sqrt(d);x*=scale;y*=scale;return {x,y,z:0};}\n    return {x,y,z:Math.sqrt(1-d)};\n  }\n  function miniQuatBetween(a,b){\n    const dot=Math.max(-1,Math.min(1,a.x*b.x+a.y*b.y+a.z*b.z));\n    let x=a.y*b.z-a.z*b.y,y=a.z*b.x-a.x*b.z,z=a.x*b.y-a.y*b.x,w=1+dot;\n    if(w<1e-7){\n      const ref=Math.abs(a.x)<.8?{x:1,y:0,z:0}:{x:0,y:1,z:0};\n      x=a.y*ref.z-a.z*ref.y;y=a.z*ref.x-a.x*ref.z;z=a.x*ref.y-a.y*ref.x;w=0;\n    }\n    return miniQuatNormalize([w,x,y,z]);\n  }\n  function applyMiniTrackball(from,to){\n    const delta=miniQuatBetween(from,to),current=state.rotation||miniQuatFromView(state.yaw,state.pitch);\n    state.rotation=miniQuatNormalize(miniQuatMultiply(delta,current));\n  }\n\n'''
          if marker not in s: raise SystemExit('tertiary transition marker not found')
          s=s.replace(marker,helpers+marker,1)

          old='''      mini.innerHTML='<div class="gps-mini-toolbar inline"><span>Mouse/one finger: rotate · Right/Ctrl drag: pan · Wheel or pinch: zoom · Double-click: reset</span><div><button type="button" id="gpsMiniZoomOut" aria-label="Zoom out">−</button><button type="button" id="gpsMiniZoomIn" aria-label="Zoom in">+</button><button type="button" id="gpsLabelsToggle">Labels: on</button><button type="button" id="gpsMiniReset">Reset / center</button></div></div>'+'''
          new='''      mini.innerHTML='<div class="gps-mini-toolbar inline"><span>Left drag / one finger: free rotate · Right/Ctrl/⌘ drag: pan · Wheel or pinch: zoom · Double-click: reset</span><div><button type="button" id="gpsMiniZoomOut" aria-label="Zoom out">−</button><button type="button" id="gpsMiniZoomIn" aria-label="Zoom in">+</button><button type="button" id="gpsLabelsToggle">Labels: on</button><button type="button" id="gpsMiniReset">Reset / center</button></div></div>'+'''
          if old not in s: raise SystemExit('mini toolbar marker not found')
          s=s.replace(old,new,1)

          old='''    if(svg&&!svg.dataset.interactionsReady){\n      svg.dataset.interactionsReady="true";svg.style.touchAction="none";\n      const pointers=new Map();let pinch=null;\n      const clampZoom=z=>Math.max(.42,Math.min(3.2,z));\n      const pointerCenter=()=>{const a=[...pointers.values()];return a.length<2?null:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)};};\n      svg.addEventListener("contextmenu",e=>e.preventDefault());\n      svg.addEventListener("wheel",e=>{e.preventDefault();state.zoom=clampZoom(state.zoom*(e.deltaY<0?1.1:.91));renderMiniModel();},{passive:false});\n      svg.addEventListener("dblclick",e=>{e.preventDefault();resetMiniView();pointers.clear();pinch=null;renderMiniModel();});\n      svg.addEventListener("pointerdown",e=>{\n        if(e.pointerType==="mouse"&&![0,1,2].includes(e.button))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture?.(e.pointerId);\n        if(pointers.size>=2){const c=pointerCenter();pinch={distance:Math.max(1,c.d),zoom:state.zoom,x:c.x,y:c.y,panX:state.panX,panY:state.panY};state.dragMode="pinch";}\n        else{state.dragging=true;state.dragMode=(e.pointerType==="mouse"&&(e.button===2||e.ctrlKey||e.metaKey||e.button===1))?"pan":"rotate";state.lastX=e.clientX;state.lastY=e.clientY;}\n      });\n      svg.addEventListener("pointermove",e=>{\n        if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});\n        if(pointers.size>=2){if(!pinch){const c=pointerCenter();pinch={distance:Math.max(1,c.d),zoom:state.zoom,x:c.x,y:c.y,panX:state.panX,panY:state.panY};}const c=pointerCenter();state.zoom=clampZoom(pinch.zoom*(c.d/pinch.distance));state.panX=pinch.panX+(c.x-pinch.x);state.panY=pinch.panY+(c.y-pinch.y);renderMiniModel();return;}\n        const dx=e.clientX-state.lastX,dy=e.clientY-state.lastY;if(state.dragMode==="pan"){state.panX+=dx;state.panY+=dy;}else{state.yaw+=dx*.0085;state.pitch=Math.max(-1.48,Math.min(1.48,state.pitch+dy*.0085));}state.lastX=e.clientX;state.lastY=e.clientY;renderMiniModel();\n      });\n      const end=e=>{pointers.delete(e.pointerId);if(svg.hasPointerCapture?.(e.pointerId))svg.releasePointerCapture(e.pointerId);pinch=null;if(pointers.size===1){const p=[...pointers.values()][0];state.lastX=p.x;state.lastY=p.y;state.dragMode="rotate";state.dragging=true;}else if(!pointers.size)state.dragging=false;};svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);\n    }'''
          new='''    if(svg&&!svg.dataset.interactionsReady){\n      svg.dataset.interactionsReady="true";svg.style.touchAction="none";svg.style.cursor="grab";\n      const pointers=new Map();let pinch=null,rotateVector=null;\n      const clampZoom=z=>Math.max(.42,Math.min(3.2,z));\n      const pointerCenter=()=>{const a=[...pointers.values()];return a.length<2?null:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)};};\n      const panScale=()=>{const rect=svg.getBoundingClientRect();return {x:640/Math.max(1,rect.width),y:520/Math.max(1,rect.height)};};\n      svg.addEventListener("contextmenu",e=>e.preventDefault());\n      svg.addEventListener("wheel",e=>{e.preventDefault();const delta=e.deltaMode===1?e.deltaY*16:e.deltaY;state.zoom=clampZoom(state.zoom*Math.exp(-delta*.0016));renderMiniModel();},{passive:false});\n      svg.addEventListener("dblclick",e=>{e.preventDefault();resetMiniView();pointers.clear();pinch=null;rotateVector=null;svg.style.cursor="grab";renderMiniModel();});\n      svg.addEventListener("pointerdown",e=>{\n        if(e.pointerType==="mouse"&&![0,1,2].includes(e.button))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture?.(e.pointerId);svg.style.cursor="grabbing";\n        if(pointers.size>=2){const c=pointerCenter();pinch={distance:Math.max(1,c.d),zoom:state.zoom,x:c.x,y:c.y,panX:state.panX,panY:state.panY};state.dragMode="pinch";rotateVector=null;}\n        else{state.dragging=true;state.dragMode=(e.pointerType==="mouse"&&(e.button===2||e.ctrlKey||e.metaKey||e.button===1))?"pan":"rotate";state.lastX=e.clientX;state.lastY=e.clientY;rotateVector=state.dragMode==="rotate"?miniTrackballVector(svg,e.clientX,e.clientY):null;}\n      });\n      svg.addEventListener("pointermove",e=>{\n        if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});\n        if(pointers.size>=2){\n          if(!pinch){const c=pointerCenter();pinch={distance:Math.max(1,c.d),zoom:state.zoom,x:c.x,y:c.y,panX:state.panX,panY:state.panY};}\n          const c=pointerCenter(),ps=panScale();state.zoom=clampZoom(pinch.zoom*(c.d/pinch.distance));state.panX=pinch.panX+(c.x-pinch.x)*ps.x;state.panY=pinch.panY+(c.y-pinch.y)*ps.y;renderMiniModel();return;\n        }\n        const dx=e.clientX-state.lastX,dy=e.clientY-state.lastY;\n        if(state.dragMode==="pan"){const ps=panScale();state.panX+=dx*ps.x;state.panY+=dy*ps.y;}\n        else{const next=miniTrackballVector(svg,e.clientX,e.clientY);if(rotateVector)applyMiniTrackball(rotateVector,next);rotateVector=next;}\n        state.lastX=e.clientX;state.lastY=e.clientY;renderMiniModel();\n      });\n      const end=e=>{\n        pointers.delete(e.pointerId);if(svg.hasPointerCapture?.(e.pointerId))svg.releasePointerCapture(e.pointerId);pinch=null;\n        if(pointers.size===1){const p=[...pointers.values()][0];state.lastX=p.x;state.lastY=p.y;state.dragMode="rotate";state.dragging=true;rotateVector=miniTrackballVector(svg,p.x,p.y);}\n        else if(!pointers.size){state.dragging=false;rotateVector=null;svg.style.cursor="grab";}\n      };\n      svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);\n    }'''
          if old not in s: raise SystemExit('interaction block marker not found')
          s=s.replace(old,new,1)

          old='''  function resetMiniView(feature=state.miniFeature){\n    const view=MINI_VIEWS[feature]||MINI_VIEWS.glycosidic;\n    state.yaw=view.yaw;state.pitch=view.pitch;state.zoom=view.zoom;state.panX=0;state.panY=0;state.dragging=false;\n  }'''
          new='''  function resetMiniView(feature=state.miniFeature){\n    const view=MINI_VIEWS[feature]||MINI_VIEWS.glycosidic;\n    state.yaw=view.yaw;state.pitch=view.pitch;state.rotation=miniQuatFromView(view.yaw,view.pitch);state.zoom=view.zoom;state.panX=0;state.panY=0;state.dragging=false;\n  }'''
          if old not in s: raise SystemExit('resetMiniView marker not found')
          s=s.replace(old,new,1)

          old='''  function rotatePoint(p){\n    const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw),cp=Math.cos(state.pitch),sp=Math.sin(state.pitch);\n    const x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy,y=p.y*cp-z*sp,z2=p.y*sp+z*cp;\n    return {...p,rx:x,ry:y,rz:z2};\n  }'''
          new='''  function rotatePoint(p){\n    if(!state.rotation)state.rotation=miniQuatFromView(state.yaw,state.pitch);\n    const r=miniRotateVector(p,state.rotation);return {...p,rx:r.x,ry:r.y,rz:r.z};\n  }'''
          if old not in s: raise SystemExit('rotatePoint marker not found')
          s=s.replace(old,new,1)

          old='''    svg.dataset.feature=state.miniFeature;svg.dataset.yaw=state.yaw.toFixed(3);svg.dataset.pitch=state.pitch.toFixed(3);svg.dataset.zoom=state.zoom.toFixed(3);'''
          new='''    svg.dataset.feature=state.miniFeature;svg.dataset.yaw=state.yaw.toFixed(3);svg.dataset.pitch=state.pitch.toFixed(3);svg.dataset.rotation=(state.rotation||miniQuatFromView(state.yaw,state.pitch)).map(v=>v.toFixed(5)).join(",");svg.dataset.zoom=state.zoom.toFixed(3);'''
          if old not in s: raise SystemExit('dataset marker not found')
          s=s.replace(old,new,1)

          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          if 'guided-transitions.js?v=guided-7' not in t: raise SystemExit('guided cache marker not found')
          idx.write_text(t.replace('guided-transitions.js?v=guided-7','guided-transitions.js?v=guided-8',1))
          PY
      - name: Validate JavaScript syntax
        run: node --check guided-transitions.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test free mini-3D interaction in browser
        run: |
          cat > /tmp/mini-3d-trackball-test.mjs <<'JS'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const errors=[];
          page.on("pageerror",e=>errors.push(String(e)));
          page.on("console",m=>{if(m.type()==="error")errors.push("console: "+m.text());});
          await page.goto("http://127.0.0.1:4173/?page=journey",{waitUntil:"domcontentloaded",timeout:30000});
          await page.locator('.scale-step[data-scene="tertiary"]').click();
          await page.waitForSelector("#scene-tertiary:not([hidden])",{timeout:10000});
          await page.waitForSelector("#gpsMini3D",{state:"visible",timeout:10000});
          await page.locator('[data-learning-feature="helix"]').click();
          await page.waitForFunction(()=>document.querySelector("#gpsMini3D")?.dataset.feature==="helix");

          const svg=page.locator("#gpsMini3D");
          const box=await svg.boundingBox();assert.ok(box&&box.width>200&&box.height>200,"Mini 3D SVG is not visible.");
          const center={x:box.x+box.width/2,y:box.y+box.height/2};
          const getState=()=>page.evaluate(()=>{const s=GuidedStructureTransitions.getState();return {rotation:s.rotation,zoom:s.zoom,panX:s.panX,panY:s.panY};});
          const start=await getState();assert.ok(Array.isArray(start.rotation)&&start.rotation.length===4,"Quaternion view state is missing.");

          await page.mouse.move(center.x,center.y);await page.mouse.down();await page.mouse.move(center.x+120,center.y,{steps:12});await page.mouse.up();
          const afterHorizontal=await getState();assert.notDeepEqual(afterHorizontal.rotation,start.rotation,"Horizontal drag did not rotate mini 3D view.");

          await page.mouse.move(center.x,center.y);await page.mouse.down();await page.mouse.move(center.x,center.y-115,{steps:12});await page.mouse.up();
          const afterVertical=await getState();assert.notDeepEqual(afterVertical.rotation,afterHorizontal.rotation,"Vertical drag did not rotate mini 3D view.");

          await page.mouse.move(center.x-100,center.y-75);await page.mouse.down();await page.mouse.move(center.x+115,center.y+90,{steps:18});await page.mouse.up();
          const afterDiagonal=await getState();
          const q=afterDiagonal.rotation,norm=Math.hypot(...q);assert.ok(Math.abs(norm-1)<1e-6,"Trackball quaternion is not normalized.");
          assert.ok(Math.abs(q[3])>1e-4,"Combined free rotation did not produce an out-of-plane/roll component.");

          await page.mouse.move(center.x,center.y);await page.mouse.down({button:"right"});await page.mouse.move(center.x+70,center.y+55,{steps:8});await page.mouse.up({button:"right"});
          const afterPan=await getState();assert.ok(Math.abs(afterPan.panX)>1||Math.abs(afterPan.panY)>1,"Right-drag did not pan mini 3D view.");

          const zoomBefore=afterPan.zoom;await page.mouse.move(center.x,center.y);await page.mouse.wheel(0,-300);await page.waitForTimeout(100);
          const afterZoom=await getState();assert.ok(afterZoom.zoom>zoomBefore,"Mouse wheel did not zoom in mini 3D view.");

          await page.mouse.dblclick(center.x,center.y);await page.waitForTimeout(80);
          const reset=await getState();assert.ok(Math.abs(reset.panX)<1e-6&&Math.abs(reset.panY)<1e-6,"Double-click did not recenter mini 3D view.");
          assert.ok(Math.abs(reset.zoom-1)<1e-6,"Double-click did not restore helix zoom.");
          assert.deepEqual(reset.rotation,start.rotation,"Double-click did not restore the feature's initial orientation.");

          const serious=errors.filter(x=>!/favicon|ResizeObserver loop/i.test(x));assert.equal(serious.length,0,"Browser errors: "+serious.join(" | "));
          console.log(JSON.stringify({result:"PASS",freeRotation:"PASS",pan:"PASS",zoom:"PASS",reset:"PASS",quaternion:afterDiagonal.rotation},null,2));
          await browser.close();
          JS
          python3 -m http.server 4173 > /tmp/rna-explorer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node /tmp/mini-3d-trackball-test.mjs
      - name: Commit tested update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guided-transitions.js index.html
          git commit -m 'Make learning 3D models freely rotatable'
          git push
