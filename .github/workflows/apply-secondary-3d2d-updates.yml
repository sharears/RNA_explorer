name: Apply secondary and 3D-to-2D updates

on:
  push:
    paths:
      - .github/workflows/apply-secondary-3d2d-updates.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply requested updates
        run: python3 .github/apply_secondary_3d2d_updates.py
      - name: Preserve derived-structure copy compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tertiary.js')
          s=p.read_text()
          s=s.replace('Experimental cWW-only 3D → 2D · ','Derived from 3D coordinates · cWW only · experimental · ')
          p.write_text(s)
          PY
      - name: Syntax checks
        run: |
          node --check secondary.js
          node --check tertiary.js
          node --check app.js
      - name: Focused regression checks
        run: |
          npm install --no-save linkedom
          mkdir -p dist
          cp index.html *.js *.css dist/
          cp -r data dist/data
          cp -r assets dist/assets
          node tests/secondary-v7.cjs
          node tests/tertiary.cjs
          node tests/security.cjs
      - name: Verify requested hooks
        run: |
          grep -q 'residueTextClearance' secondary.js
          grep -q 'Show circle for selected residue' secondary.js
          grep -q 'Comic Sans MS' styles.css
          grep -q 'detectCwwPairs' tertiary.js
          grep -q 'CWW_CUTOFFS' tertiary.js
          grep -q 'cWW only' tertiary.js
          grep -q 'publication-ready' tertiary.js
          grep -q 'state.chains.length>1' tertiary.js
      - name: Commit finished update
        run: |
          rm -f .github/workflows/apply-secondary-3d2d-updates.yml .github/apply_secondary_3d2d_updates.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secondary.js tertiary.js styles.css index.html .github/workflows/apply-secondary-3d2d-updates.yml .github/apply_secondary_3d2d_updates.py
          git commit -m "Improve secondary readability and add cWW 3D-to-2D generation"
          git push origin HEAD:main
