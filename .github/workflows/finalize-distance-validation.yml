name: Finalize distance validation

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add deterministic measurement validation hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tertiary.js')
          s=p.read_text()
          needle='  function measurementCentroid(points){return points.reduce((o,p)=>({x:o.x+p.x/points.length,y:o.y+p.y/points.length,z:o.z+p.z/points.length}),{x:0,y:0,z:0});}'
          helper='\n'.join([
              '  function createDistanceMeasurementFromAtomIndices(firstIndex=0,secondIndex=1){',
              '    if(state.measurementMode!=="distance")throw new Error("Distance measurement mode must be active.");',
              '    if(!model?.selectedAtoms)throw new Error("No active 3D model is available.");',
              '    const atoms=model.selectedAtoms({});',
              '    const a=Number(firstIndex),b=Number(secondIndex);',
              '    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>=atoms.length||b>=atoms.length||a===b)throw new Error("Choose two different valid atom indices.");',
              '    const before=state.measurements.length;',
              '    state.measurementPicks=[];',
              '    handleAtomMeasurementClick(atoms[a]);',
              '    handleAtomMeasurementClick(atoms[b]);',
              '    const measurement=state.measurements.at(-1);',
              '    if(state.measurements.length!==before+1||!measurement||measurement.type!=="distance")throw new Error("Distance measurement was not created.");',
              '    return {id:measurement.id,type:measurement.type,value:measurement.value,points:measurement.points};',
              '  }',
              ''
          ])
          if needle not in s: raise SystemExit('measurement insertion point not found')
          s=s.replace(needle,helper+needle,1)
          old='showLearningFeature,clearLearningFeature,showLinkedRegion,clearLinkedRegion,\n    getDiagnostics()'
          new='showLearningFeature,clearLearningFeature,showLinkedRegion,clearLinkedRegion,createDistanceMeasurementFromAtomIndices,\n    getDiagnostics()'
          if old not in s: raise SystemExit('public API insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          test=Path('tests/learning-advanced-complete-browser.mjs')
          t=test.read_text()
          start=t.index('  const measurement=await page.evaluate(()=>{')
          end=t.index('  const measurementText=',start)
          replacement='\n'.join([
              '  const measurement=await page.evaluate(()=>TertiaryExplorer.createDistanceMeasurementFromAtomIndices(0,1));',
              '  const measured=Number(measurement.value);',
              '  if(measurement.type!=="distance"||!Number.isFinite(measured)||measured<=0){',
              '    throw new Error("Distance result is invalid: "+JSON.stringify(measurement));',
              '  }',
              ''
          ])
          t=t[:start]+replacement+t[end:]
          test.write_text(t)
          Path('.github/workflows/finalize-distance-validation.yml').unlink()
          PY
      - name: Check syntax
        run: |
          node --check tertiary.js
          node --check tests/learning-advanced-complete-browser.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tertiary.js tests/learning-advanced-complete-browser.mjs .github/workflows/finalize-distance-validation.yml
          git commit -m "Make 3D distance browser validation deterministic"
          git push
