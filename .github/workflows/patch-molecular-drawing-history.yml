name: Patch molecular drawing lasso and redo
on:
  push:
    paths:
      - .github/workflows/patch-molecular-drawing-history.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/patch_molecular_history.py
      - name: Validate JavaScript
        run: node --check chemistry-editor.js && node --check tests/molecular-editor-history-browser.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser test
        run: |
          python3 -m http.server 4173 > /tmp/rna-explorer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/molecular-editor-history-browser.mjs
      - name: Commit tested update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chemistry-editor.js index.html tests/molecular-editor-history-browser.mjs
          git commit -m 'Fix molecular lasso selection and add redo history'
          git push
