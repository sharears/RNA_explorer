name: Guided advanced-control smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p dist && cp index.html *.js *.css dist/ && cp -r data dist/data && cp -r assets dist/assets
      - name: Guided controls, More-menu hover, and 1HS8 browser stress test
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/rna-explorer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/utility-hover-browser.mjs
          node tests/learning-advanced-complete-browser.mjs
      - name: Upload 1HS8 styled screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1HS8-styled-browser-proof
          path: test-output/1HS8-styled.png
          if-no-files-found: ignore
